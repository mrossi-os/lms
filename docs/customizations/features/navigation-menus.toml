id = "navigation-menus"
title = "Barra laterale e menu"
status = "active"
summary = """
La barra laterale presenta la piattaforma con il marchio del cliente: niente rimandi a Frappe, al
suo percorso di onboarding o alle pagine web personalizzate, e in fondo il numero di versione
installata. L'amministratore può nascondere anche le voci Home, Programmi, Cerca, Quiz e Compiti. Il
menu utente è in italiano e la navigazione su telefono usa i colori del tema."""
why = """
La piattaforma è venduta con il marchio del cliente e non deve rimandare a Frappe; le pagine web
personalizzate dell'upstream non sono usate. Il cliente voleva poter spegnere più voci della barra di
quante l'upstream ne preveda, e il numero di versione serve a capire quale build è installata su un
sito quando si segnala un problema."""
roles = ["Student", "Moderator", "Gestore", "System Manager"]
