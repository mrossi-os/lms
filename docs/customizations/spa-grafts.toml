[[entries]]
id = "program-description"
title = "Descrizione del programma visibile allo studente"
layer = "spa-graft"
confidence = "high"
intent = """
La descrizione del programma (campo custom os_lms) si mostra sia nel dettaglio del
programma sia nel dialogo di iscrizione, con la formattazione conservata e sanificata
con sanitizeRichHTML. hasRichContent, aggiunta al file upstream sanitizeRichHTML.ts,
nasconde la descrizione svuotata che l'editor salva come <p></p>: senza, lo studente
vedrebbe un blocco vuoto."""

  [[entries.sites]]
  file = "frontend/src/pages/Programs/ProgramDetail.vue"
  anchor = ":description=\"sanitizeRichHTML(program.data.description)\""

  [[entries.sites]]
  file = "frontend/src/pages/Programs/ProgramEnrollment.vue"
  anchor = ":description=\"sanitizeRichHTML(program.data.description)\""

  [[entries.sites]]
  file = "frontend/src/utils/sanitizeRichHTML.ts"
  anchor = "export const hasRichContent"
  symbol = "hasRichContent"

[[entries]]
id = "home-programs-row"
title = "Riga dei programmi nella home dello studente"
layer = "spa-graft"
confidence = "high"
intent = """
La home dello studente mostra i suoi programmi o, se non è iscritto a nessuno, quelli
pubblicati (stesso schema della riga dei batch). Riusa la risorsa programs dello store
settings già caricata dalla sidebar invece di una seconda chiamata; la carica solo se
nessuno l'ha fatto (layout mobile senza sidebar). Un programma non iscritto apre il
dialogo di iscrizione invece del dettaglio."""

  [[entries.sites]]
  file = "frontend/src/pages/Home/StudentHome.vue"
  anchor = "<div v-if=\"homePrograms.length\" class=\"mt-10\">"

  [[entries.sites]]
  file = "frontend/src/pages/Home/StudentHome.vue"
  anchor = "if (!programs.data && !programs.loading) programs.reload()"

[[entries]]
id = "program-member-unpublished-course"
title = "Membri del programma vedono i corsi non pubblicati"
layer = "spa-graft"
confidence = "high"
intent = """
Un programma si pubblica nel suo insieme: chi ne è membro vede, apre e si iscrive a ogni
corso del programma anche se il corso da solo non è pubblicato. La regola vive in tre
guardie, due delle quali in file upstream: get_course_details e la validazione
dell'iscrizione di LMSEnrollment, entrambe tramite is_course_in_member_program (definita in
lms/lms/utils.py accanto a is_course_valutatore); la terza è la guardia di redirect di
CourseDetail.vue, che legge il flag in_member_program esposto dall'override os_lms di
get_course_details. Se sparisce una delle guardie server, lo studente del programma non
vede il corso o non può iscriversi; se sparisce quella della pagina, viene rimandato alla
lista corsi. Decisione del cliente del 2026-09-23."""

  [[entries.sites]]
  file = "lms/lms/utils.py"
  anchor = "def is_course_in_member_program(course: str, user: str = None) -> bool:"
  symbol = "is_course_in_member_program"

  [[entries.sites]]
  file = "lms/lms/utils.py"
  anchor = "and not is_course_in_member_program(course)"
  symbol = "get_course_details"

  [[entries.sites]]
  file = "lms/lms/doctype/lms_enrollment/lms_enrollment.py"
  anchor = "and not is_course_in_member_program(self.course, self.member)"
  symbol = "LMSEnrollment.validate_course_enrollment_eligibility"

  [[entries.sites]]
  file = "frontend/src/pages/Courses/CourseDetail.vue"
  anchor = "!course.data?.in_member_program &&"

  [[entries.sites]]
  file = "frontend/src/types/api.ts"
  anchor = "in_member_program?: 0 | 1"

  [entries.checks]
  backend = "apps/os_lms/os_lms/os_lms/tests/test_program_course_access.py"

