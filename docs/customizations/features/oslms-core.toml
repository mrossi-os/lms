notes = """
- Dopo OGNI merge upstream lanciare, nel container, os_lms.os_lms.tests.test_override_signatures
  e la suite di os_lms. Le ancore provano solo che il testo c'è, non che il ramo sia raggiungibile:
  quando l'upstream riscrive una funzione che contiene un ramo OSLMS controllare che ci si arrivi
  ancora (v2.63.0 ha spostato un controllo di iscrizione prima del ramo Valutatore di can_access_quiz).
- I test dei quiz di lms sul database di sviluppo sono distruttivi (tearDownClass cancella TUTTE le
  LMS Question): lanciarli con frappe.db.commit disattivato e rollback finale.
- has_permission: in questa versione di Frappe un hook che restituisce None vale come rifiuto.
  Restituire True nel caso neutro, False solo per vietare.
- Mai usare frappe.set_user dentro una richiesta per scavalcare un controllo di ruolo dell'upstream:
  riscrive sid e dati di sessione e disconnette chi chiama. Copiare il corpo della funzione con il
  controllo allargato, con un test che lo confronta con l'upstream.
- has_value_changed normalizza solo date e orari: un Int che arriva dalla SPA come stringa sembra
  cambiato a ogni salvataggio. Per gli hook che reagiscono a modifiche vere normalizzare i due lati
  (helper api.normalize_live_class_value).
- Campi upstream validati su un Single: se l'upstream aggiunge un campo con default e una
  validazione, il record già esistente tiene 0/NULL e ogni salvataggio delle impostazioni fallisce
  (417 su schede non correlate). Rimedio: patch post_model_sync di backfill (v0_0_5).
- create_custom_fields crea solo i campi che mancano: cambiare la definizione in CUSTOM_FIELDS non
  aggiorna un campo già esistente.
- Container di sviluppo: init.sh fa bench migrate solo all'avvio; impostazioni che non si salvano o
  funzioni legate a un flag che spariscono = meta dei doctype vecchia nel container (frappe.get_meta(dt)
  .get_field(f) sul sito che gira). Se la CLI bench è rotta usare il python dell'env.
- Deploy di staging: install-app --force a ogni avvio segnava tutte le patch come eseguite prima del
  migrate, quindi le patch nuove non giravano; prima di provare su staging verificare l'effetto di
  ogni patch nuova.
- api.py, override_api.py e override_utils.py contengono codice di molte funzionalità (ruoli,
  impostazioni, membri, live, AI, TrueSkills...): le regole stanno nelle schede di quelle funzioni;
  qui resta la compatibilità con le firme upstream. Il ponte boot_config esiste perché frappe-ui
  beta.29 chiede un metodo di Frappe develop (prima il problema era nato dal caret su frappe-ui).
- Voce condivisa open-external-opener-and-pending-tab: copre Google Calendar (scheda
  zoom-google-calendar) e i certificati TrueSkills (scheda trueskills-certificates).
- Lacuna nota: il file indicato da standard_email_override in hooks.py
  (os_lms/templates/emails/login_via_key.html) non esiste nel repository."""
