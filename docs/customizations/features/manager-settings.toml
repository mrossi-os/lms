id = "manager-settings"
title = "Impostazioni gestore: pannello per il Gestore, Impostazioni solo all'Administrator"
status = "active"
summary = """
Il menu utente ha due pannelli. «Impostazioni» (Settings.vue) è solo per l'Administrator (utente
Administrator o ruolo System Manager). «Impostazioni gestore» è per Gestore e Administrator e
contiene le sole schede che il Gestore può toccare: avanzamento del corso, categorie, modelli
email, utenti, Zoom, Google Meet, Google Calendar, marchio e benvenuto. Il server limita i campi
di LMS Settings che un non-Administrator può salvare. I collegamenti alle impostazioni sparsi nella
SPA aprono il pannello che l'utente può usare, o avvisano che la sezione è solo per amministratori."""
why = """
Prima la voce «Impostazioni» si mostrava a chiunque avesse is_moderator e dava al Gestore tutte le
configurazioni del sito. Il cliente vuole che il Gestore gestisca le impostazioni operative senza
poter cambiare quelle di piattaforma. Il Gestore di norma non raggiunge il Desk, quindi il pannello
vive nella SPA. Design: docs/superpowers/specs/2026-11-18-impostazioni-gestore-design.md."""
roles = ["Gestore", "System Manager", "Moderator"]
behaviour = [
	"la voce «Impostazioni» del menu utente compare solo all'Administrator (utente Administrator o ruolo System Manager); la voce «Impostazioni gestore» a Gestore e Administrator",
	"il pannello gestore mostra le schede Course Progress, Categories, Email Templates, Users, Zoom, Google Meet, Google Calendar, Branding e Welcome; sono definite una sola volta in oslms/utils/settingsTabs.js e condivise con Settings.vue",
	"il server rifiuta il salvataggio di campi di LMS Settings fuori dal pannello gestore quando chi salva non è Administrator (validate os_lms settings_access.validate_lms_settings_access)",
	"update_sidebar_item, delete_sidebar_item e delete_documents dell'upstream passano da os_lms: voci della barra laterale e paesi di pagamento sono solo Administrator",
	"la scheda Branding salva con os_lms settings_access.save_branding (Administrator, System Manager o Gestore), che scrive solo app_name, banner_image, app_logo (uguale a banner_image) e favicon; il Gestore non riceve il ruolo Website Manager",
	"openSettings(categoria) apre Settings.vue per l'Administrator, il pannello gestore per il Gestore se la scheda è sua, altrimenti mostra «Questa sezione è disponibile solo agli amministratori.»",
	"i pulsanti di BatchForm verso 'Zoom Accounts' e 'Google Meet Accounts' aprono le schede reali Zoom e Google Meet",
	"nella palette Cmd+K «Settings» è solo Administrator e «Manager Settings» è per Gestore e Administrator; il pulsante Impostazioni → General degli esercizi di programmazione è solo Administrator",
	"alla chiusura di uno dei due pannelli le tendine <Link> ricaricano le opzioni, così una categoria o un account creati lì compaiono subito",
]
