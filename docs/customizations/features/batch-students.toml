id = "batch-students"
title = "Iscrizione e rimozione degli studenti della classe"
status = "active"
summary = """
Chi gestisce una classe può iscrivere più studenti insieme, importarli da un file e toglierli dalla
classe, tutto dalla dashboard della classe e senza passare dal Desk. Chi entra in una classe viene
iscritto a tutti i suoi corsi, anche a quelli aggiunti dopo che la classe è partita."""
why = """
Il cliente iscrive gruppi numerosi alle classi e non usa i pagamenti. L'upstream iscriveva uno
studente alla volta e chiedeva il pagamento; soprattutto creava le iscrizioni ai corsi quando
l'iscrizione alla classe non era ancora scritta, così uno studente che si iscriveva da solo veniva
respinto dai corsi non aperti all'autoiscrizione, e un corso aggiunto a una classe già avviata non
arrivava agli studenti già presenti, che non lo vedevano (correzione del 2026-09-10)."""
roles = ["Moderator", "Batch Evaluator", "Docente", "Course Creator", "Student", "Valutatore"]
