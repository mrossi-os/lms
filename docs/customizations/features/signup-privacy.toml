notes = """
- lms/templates/signup-form.html è riscritto a ogni release importante dell'upstream (v2.62.0 l'ha
  rifatto per intero, v2.65.0 ha aggiunto la select della categoria costruita a parte con
  vite.signup-select.config.js). Al merge: prendere il file upstream e riapplicare etichetta breve
  e riquadro scorrevole (id signup-terms invariato, la validazione upstream lo usa), togliere il
  blocco {% if user_category %}, rimettere la casella privacy e il parametro accept_privacy.
  Tradurre le stringhe nuove dell'upstream. La build separata signup-select resta nel package.json
  upstream e yarn build la esegue anche se non ha più niente da montare.
- login.py sceglie signup_form_template con l'ultimo hook registrato: se l'upstream cambia questa
  regola o la chiamata a lms.lms.user.sign_up, la casella privacy sparisce senza errori.
- La finestra privacy legge l'utente da usersStore(), non da inject('$user'): main.js fa provide
  dopo app.mount, quindi nei componenti montati subito (App.vue) inject restituisce undefined.
  L'etichetta con il link è una frase sola tradotta con {0}: __() restituisce un oggetto con
  .format quando la frase ha segnaposto, mai una stringa da spezzare.
- La pagina /new-sign-up (invito dell'upstream senza più backend) rimanda a /login
  (website_redirects in hooks.py, rilievo OWASP E2).
- La voce di inventario account-deletion-review-and-privacy-consent è collegata alla scheda
  account-deletion e copre anche la casella privacy in signup-form.html e la finestra in App.vue."""
