notes = """
- Il link mancante si compila in before_insert e non sovrascrivendo notify_member, per non congelare
  qui oggetto e testo dell'email upstream (l'upstream li ha già riformulati una volta, 45e98b9dd).
  Anche la notifica push legge doc.link in after_insert e lo eredita.
- Le etichette delle schede del pannello sono getter che chiamano __() a ogni rendering: un array
  costruito al setup valuta __() prima che le traduzioni asincrone siano caricate e resta in inglese
  al ricaricamento completo (corretto invece dopo un HMR, sintomo tipico).
- make_notification_logs cerca i destinatari per EMAIL, non per nome utente: Administrator
  (admin@example.com) non riceve nulla, senza errori. Il tipo Alert non viene mai inviato per email.
- Un testo di notifica prodotto da un job in background era in inglese e restava congelato nel
  database: os_lms imposta la lingua dell'utente in before_job (set_job_language).
- Il badge delle schede è innestato nel componente upstream TabbedDetailPage (prop badge, dal merge
  di v2.62.0): se l'upstream cambia il rendering delle schede, riportarlo.
- Il pannello stesso (slide-over) è dell'upstream (13bf2825d); la nostra parte è il ramo di
  navigazione."""
