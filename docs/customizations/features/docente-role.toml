notes = """
- La SPA decide cosa mostrare dai flag di $user (is_moderator, is_instructor, is_docente), non dai
  permessi dei doctype: ogni nuovo gate upstream del tipo «is_moderator || is_instructor» o
  «isAdmin» va controllato; il server decide con can_modify_course / can_modify_batch /
  can_author_batch e i predicati di permissions.py. Pulsante visibile e server che rifiuta (o
  viceversa) è il sintomo tipico di un innesto perso.
- Dopo ogni merge ricontrollare is_docente in CourseDetail.vue, Lesson.vue e CourseCardOverlay.vue:
  il bypass era già stato perso in un merge di giugno 2026 e ritrovato solo al collaudo del 2026-10-05.
- Eccezione voluta (2026-09-23, ribadita 2026-10-05 dopo la matrice dei ruoli): sui corsi che non
  insegna il Docente non ha Impostazioni, Dashboard, Editor né Simulazioni; CourseForm.checkPermission
  non deve ammettere is_docente. Le API della dashboard però lo lasciano passare: è solo la SPA a
  nascondere la scheda.
- search_users_by_role è una copia del corpo upstream (v2.64.0) con il Docente nell'only_for: va
  riconfrontata a ogni merge (test_same_answer_as_upstream). Mai usare frappe.set_user per aggirare
  un only_for: disconnette il chiamante.
- I certificati non seguono la regola globale: il Docente vede e gestisce solo quelli dei corsi in
  cui è istruttore (scheda course-certificates). Programmi: scheda programs.
- Bundle reale in produzione: Docente + «Istruttore della classe» (Batch Evaluator), spesso senza
  Course Creator (verifica 2026-10-12): senza le DocPerm del Desk su LMS Course, Course Chapter,
  LMS Question, LMS Quiz Submission e LMS Course Progress un Docente così non crea corsi né legge le
  risposte dei quiz. È una scelta del cliente da fare nel Desk, non nel codice. Nei piani di test
  usare sempre i bundle, mai il ruolo da solo.
- Le voci course-lesson-list-mirrors-read-gate e i test test_role_gates_v2_64/65 sono condivisi con
  la scheda valutatore-role; le voci live del Docente e can_author_batch toccano anche
  batch-management-permissions."""
