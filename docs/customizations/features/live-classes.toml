id = "live-classes"
title = "Lezioni dal vivo: gestione, promemoria e inviti"
status = "active"
summary = """
Chi gestisce una classe crea, modifica, riprogramma ed elimina le lezioni dal vivo (Zoom o Google
Meet) dalla scheda Lezioni della classe. Ogni lezione ha i suoi promemoria via email, gli iscritti
ricevono l'invito con i pulsanti per aggiungerla al proprio calendario e vengono avvisati quando la
lezione cambia o viene annullata. La stessa card mostra le lezioni nella home e nella classe, con i
pulsanti Avvia e Partecipa. Le lezioni dal vivo si possono spegnere per tutto il sito."""
why = """
L'upstream crea le lezioni dal vivo ma non permette di modificarle, riprogrammarle o eliminarle
dalla classe, non ha promemoria configurabili e manda inviti in inglese senza scelta del calendario.
Il cliente organizza molte lezioni per classe e vuole avvisare gli studenti a ogni cambio, con email
in italiano e con il proprio marchio. Le regole di accesso alla stanza sono nella scheda
live-class-gated-join."""
roles = ["Moderator", "Docente", "Batch Evaluator", "Valutatore", "Student", "Gestore"]
behaviour = [
	"una lezione si crea e si modifica dal modulo della classe (rotte NewLiveClass e EditLiveClass, live-class/<nome>/edit); modificano ed eliminano solo Moderator, Docente e gli istruttori ed esaminatori indicati sulla classe",
	"in modifica si possono cambiare titolo, descrizione, data, ora, durata, fuso e promemoria; la data futura è richiesta solo se l'orario cambia davvero, così si corregge anche il titolo di una lezione passata; la registrazione automatica Zoom si sceglie solo alla creazione",
	"dopo che chi conduce ha premuto Avvia, data, ora, durata e fuso sono bloccati anche lato server e un avviso lo spiega; restano modificabili titolo, descrizione e promemoria",
