id = "student-highlights"
title = "Evidenziazioni dello studente"
status = "active"
summary = """
Lo studente può evidenziare a colori una frase della lezione e attaccarci una nota. Le
evidenziazioni ricompaiono esattamente sul punto scelto, anche quando la stessa parola compare più
volte, e il menu che si apre selezionando il testo è leggibile anche nel tema scuro."""
why = """
Nell'upstream un'evidenziazione era salvata solo come testo e al ritorno si illuminava sempre la
prima occorrenza (evidenziando il terzo «con» si accendeva il primo), con effetti a catena: il menu
cancellava la nota sbagliata e le selezioni che attraversavano più elementi fallivano. Il menu non
aveva un colore del testo e nel tema scuro restava nero su scuro."""
roles = ["Student"]
behaviour = [
	"un'evidenziazione ricompare sull'occorrenza selezionata, non sulla prima uguale nel testo",
	"le evidenziazioni salvate prima della correzione ricompaiono sull'occorrenza più vicina alla posizione salvata, o sulla prima se la posizione manca",
	"si può evidenziare una selezione che attraversa più elementi (per esempio parte in grassetto e parte no)",
	"ricaricando l'elenco delle note le evidenziazioni non si sovrappongono né si duplicano",
	"dal menu di un'evidenziazione si modifica o si cancella proprio quella nota, anche se lo stesso testo è evidenziato altrove; cancellandola il testo torna normale",
	"nel menu che si apre selezionando il testo, nomi dei colori e azioni sono leggibili sia nel tema chiaro sia in quello scuro",
]
areas = ["frontend/src/tests/lessonHighlight.test.ts"]
upstream_watch = [
	"highlight", "LMS Lesson Note", "text_offset", "InlineLessonMenu.vue", "highlightText",
	"createHighlightSpan", "surroundContents", "getRangeOffset", "removeHighlight", "types/notes.ts",
	"frappe-ui-colors.json",
]
data = [
	"custom field LMS Lesson Note.text_offset (posizione dell'occorrenza), creato da apps/os_lms/os_lms/setup.py e tipizzato in frontend/src/types/notes.ts",
]
tests = ["frontend/src/tests/lessonHighlight.test.ts"]
