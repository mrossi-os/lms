# Accepted exceptions for the Dependency Scan workflow (OWASP A03).
#
# Every entry says why the vulnerability does not reach users or cannot be fixed
# within the same major version yet. `ignoreUntil` brings it back into the scan
# on that date, so each exception gets reviewed instead of staying forever.
