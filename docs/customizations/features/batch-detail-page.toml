id = "batch-detail-page"
title = "Pagina della classe"
status = "active"
summary = """
La pagina di una classe mostra nella panoramica la descrizione con i suoi a capo e il video di
anteprima, mette nell'intestazione le azioni della scheda aperta (importare o iscrivere studenti,
fare un annuncio) e porta ai corsi giusti. Nella scelta dei corsi da aggiungere compaiono anche
quelli non ancora pubblicati."""
why = """
Il cliente prepara le classi prima che partano, quando i corsi non sono ancora pubblicati, e voleva
le azioni più usate a portata di mano. L'upstream perdeva gli a capo della descrizione, non mostrava
il video di anteprima della classe, apriva un corso inesistente cliccando una riga della scheda Corsi
(usava il nome della riga figlia invece del corso) e lasciava in inglese colonne e stati delle
valutazioni."""
roles = ["Moderator", "Batch Evaluator", "Docente", "Course Creator", "Student"]
behaviour = [
	"nella panoramica della classe la descrizione breve conserva gli a capo con cui è stata scritta",
	"il video di anteprima della classe compare sotto la descrizione breve a ogni larghezza dello schermo, largo quanto la descrizione e in 16:9; prezzo, posti e invito all'iscrizione dell'upstream non compaiono",
	"sulla scheda Dashboard l'intestazione ha, accanto a «Iscrivi» (pulsante pieno), il pulsante «Importa», che apre l'importazione dati delle iscrizioni alla classe",
	"sulla scheda Annunci l'intestazione ha il pulsante «Fai un annuncio», disattivato con un suggerimento quando la classe non ha studenti; il menu «...» non ha la voce annuncio",
	"i pulsanti Importa, Iscrivi e Fai un annuncio compaiono a Moderator, Batch Evaluator e Docente (e a chi gestisce la classe), non al Valutatore né allo studente",
	"cliccando un corso nella scheda Corsi della classe si apre quel corso",
	"nelle liste Corsi e Valutazioni della classe le intestazioni delle colonne e lo stato della valutazione sono in italiano, anche nella dashboard dello studente",
	"nella scelta del corso da aggiungere alla classe compaiono tutti i corsi, anche le bozze; il modulo è aperto solo al Moderator e a chi gestisce la classe",
]
