id = "video-embeds"
title = "Video YouTube e Vimeo"
status = "active"
summary = """
I video Vimeo funzionano ovunque funzionano quelli YouTube: nelle lezioni, nel video di anteprima di
corsi e classi e nel banner del corso. Gli autori possono incollare anche il link di condivisione di
Vimeo, che la piattaforma trasforma da sé nel link giusto. Le anteprime si guardano con lo stesso
player delle lezioni, senza i controlli del sito del provider."""
why = """
Il cliente pubblica i suoi video su Vimeo, spesso non in elenco, mentre l'upstream conosce solo
YouTube e i file caricati: un link Vimeo finiva in un lettore che non caricava nulla e il vecchio
salvataggio del link rovinava le forme vimeo.com/<id>/<hash>. Il pulsante «Copia link» di Vimeo dà un
link di condivisione che nessuno può incorporare, e gli autori ottenevano testo al posto del video.
Le anteprime nell'iframe del provider mostravano titolo, canale, condivisione e video suggeriti."""
roles = ["Moderator", "Course Creator", "Docente", "Student"]
behaviour = [
	"il video di anteprima di un corso o di una classe su YouTube o Vimeo si riproduce con lo stesso player delle lezioni, senza titolo, canale, condivisione né griglia di fine video del provider, e lo spazio 16:9 è riservato mentre il player parte",
	"incollando nell'editor della lezione un link vimeo.com/share/<codice>, il blocco diventa un normale video Vimeo; se la risoluzione non riesce il link resta come testo e compare un messaggio",
	"il campo «Video di anteprima» di corsi e classi accetta link YouTube e Vimeo, mostra l'anteprima anche per Vimeo e i suoi testi dicono «YouTube o Vimeo»",
	"un link di condivisione Vimeo incollato nel campo «Video di anteprima» viene sostituito dal link canonico del video; se la risoluzione non riesce compare un messaggio e il valore resta com'è",
	"i video Vimeo non in elenco, con il codice privato nel link (vimeo.com/<id>/<hash> o ?h=), si riproducono nelle lezioni, nelle anteprime e nel banner del corso",
	"salvando il corso, un link YouTube del video di anteprima (watch?v= o youtu.be/) viene ridotto all'id del video, mentre un link Vimeo o un file caricato resta intero",
	"la risoluzione dei link di condivisione Vimeo è rifiutata agli utenti non autenticati e accetta solo link vimeo.com/share/",
	"con l'integrazione Vimeo attiva, l'audio di una lezione con video Vimeo (usato dall'app) si ottiene solo se l'utente può aprire la lezione in quel momento; in modalità test si riceve l'audio di prova configurato",
]
