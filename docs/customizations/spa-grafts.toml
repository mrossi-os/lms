Un'anteprima YouTube/Vimeo si riproduce con lo stesso player Plyr delle lezioni invece
che con l'iframe nudo del provider, così non compaiono i controlli del provider (titolo,
canale, condividi, griglia di fine video). Il contenitore riserva il 16:9 mentre Plyr
