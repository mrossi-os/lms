layer = "spa-graft"
confidence = "high"
intent = """
Quando il corso ha attivi enforce_lesson_order o enforce_quiz_on_completion (impostazioni
os_lms del corso, OsCourseSettings), lo studente non può aprire una lezione finché la
precedente non è completata, né il quiz finché la lezione non è completata. I flag
lesson_access e quiz_access li calcola l'override os_lms di get_lesson; la pagina mostra la
schermata «Lezione bloccata» al posto del corpo, le due schermate «Quiz bloccato» (quiz
dentro il contenuto EditorJS e quiz legacy body/quiz_id), disabilita i pulsanti Next e
nasconde il pannello Note. markProgress non segna mai completa una lezione bloccata:
altrimenti il timer di permanenza, che gira dietro la schermata di blocco, sbloccherebbe
da solo la lezione successiva e il blocco diventerebbe decorativo. Già perso una volta
con il merge upstream 1f5978236 (04/06/2026) e ripristinato in d88fc97f4: senza questo
innesto i due interruttori restano configurabili ma non hanno alcun effetto. Le condizioni
sono innestate sulle catene v-if esistenti (non un <template> che avvolge il corpo) per
tenere piccola la superficie di conflitto. ATTENZIONE: v2.63.0 riscrive profondamente
