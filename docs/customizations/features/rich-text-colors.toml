id = "rich-text-colors"
title = "Colori ed evidenziazioni nel testo formattato"
status = "active"
summary = """
I colori del testo e gli evidenziatori scelti negli editor si salvano e si vedono dove il testo
viene letto: nelle lezioni, nelle descrizioni di corsi e classi, negli annunci (anteprima, email e
notifica). Nelle lezioni lo strumento colore permette anche di togliere un colore o un
evidenziatore già messo."""
why = """
Docenti e gestori usano il colore per mettere in risalto i passaggi importanti, ma in più punti
dell'upstream il colore si perdeva: nelle lezioni il server lo cancellava al salvataggio, nel nuovo
editor di frappe-ui il foglio di stile non arrivava nel build e il colore veniva salvato ma non
dipinto, negli annunci le variabili di colore esistevano solo dentro l'editor. Con v2.63.0
l'upstream ha tolto lo strumento colore delle lezioni e lo abbiamo ricostruito."""
roles = ["Moderator", "Course Creator", "Docente", "Gestore", "Student"]
behaviour = [
	"nell'editor della lezione lo strumento Colore applica alla selezione un colore del testo e un evidenziatore, che restano dopo il salvataggio e il ricaricamento e si vedono nella lezione dello studente",
	"il pannello dello strumento Colore ha per ciascun selettore un pulsante di ripristino («Predefinito» per il testo, «Nessun evidenziatore» per lo sfondo); se non resta nessuno stile, il testo torna normale",
	"le lezioni scritte con il vecchio strumento colore conservano il colore e si possono di nuovo modificare con quello nuovo",
	"nel nuovo editor di testo (descrizioni di corsi e classi, discussioni, compiti, quiz) il colore del testo e l'evidenziatore scelti si vedono davvero, sia mentre si scrive sia nel testo pubblicato",
	"negli annunci, colori ed evidenziatori compaiono nell'anteprima e nell'email ricevuta; nella notifica senza email la card dell'annuncio li mostra con tonalità leggibili nel tema chiaro e in quello scuro, e il testo evidenziato mantiene il suo colore",
	"nel menu colore della barra del vecchio editor di testo (per esempio nella descrizione dei programmi) intestazioni e nomi dei colori sono in italiano",
	"nei testi formattati la linea di separazione prende il colore del testo intorno, quindi resta visibile su sfondi scuri, e i bordi delle tabelle sono visibili",
]
areas = [
