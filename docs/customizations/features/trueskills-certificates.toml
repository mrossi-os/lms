notes = """
- Riferimento dell'API TrueSkill: header X-Api-Key, base /api/v1/service/certificates, il campo
  message è il contratto stabile degli errori; POST /issue e POST /templates non sono idempotenti e
  non si ritentano mai in automatico (per questo il controllo orario abbina e non riemette).
- Il controllo orario abbina per nome del template e finestra temporale, perché /list non
  restituisce l'email: due studenti nella stessa finestra restano «ambigui» e vanno risolti a mano.
- L'immagine del badge ricavata dal certificato del corso usa il generatore PDF Chrome e ruota la
  pagina rasterizzata (certificate_image.py): wkhtmltopdf produce una pagina bianca con il modello
  ruotato del cliente.
- openBadgeImage non deve far passare l'URL blob: da navigate()/safeUrl (che rifiuta blob:):
  regressione del 2026-09-25 corretta in a5c355069.
- Certificati ricevuti: nessuna cache, una chiamata separata dalle altre del profilo (eccezione
  voluta alla regola della chiamata unica), il download ripete la ricerca per email. Se «non
  compare nulla», controllare quale organizzazione TrueSkill ha emesso il badge e a quale
  appartiene la chiave dell'istanza (Test connection → organizationId).
- apps/os_lms/TRUESKILLS.md è in parte superato: §3 descrive ancora la card PDF con il footer
  Openbadge e §8.3 assegna test della connessione e retry a Moderator e Course Creator, mentre oggi
  sono System Manager e Gestore (e il log è solo lettura per Moderator).
- Il filtro «Certificazione» dell'elenco corsi conta anche i corsi TrueSkill grazie a un innesto in
  update_course_filters (lms/lms/utils.py).
- Il campo codice fiscale del profilo è nella scheda profile-page; l'azzeramento dei progressi
  (course-progress-reset) cancella anche i log di emissione."""
