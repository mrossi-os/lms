[[entries]]
id = "course-form-os-sections"
title = "Impostazioni custom del corso nel modulo impostazioni"
layer = "spa-graft"
confidence = "high"
intent = """
Le impostazioni del corso volute dal cliente vivono in due componenti os_lms montati dentro
il CourseForm upstream: OsCourseDetailForm (hero con immagine o video, feature sections) nella
colonna principale e OsCourseSettings (regole di apprendimento: blocco delle lezioni in
