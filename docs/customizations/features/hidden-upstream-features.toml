id = "hidden-upstream-features"
title = "Funzioni dell'LMS standard spente"
status = "active"
summary = """
Alcune funzioni dell'LMS standard non servono al cliente e sono nascoste: pagamenti e coupon, prezzi
e certificati a pagamento, recensioni dei corsi, offerte di lavoro nella ricerca rapida e feedback
della classe. Il codice upstream resta al suo posto; le poche pagine ancora raggiungibili hanno le
etichette tradotte."""
why = """
La piattaforma non vende corsi né certificati, non raccoglie recensioni né feedback di classe da
queste sezioni e non pubblica offerte di lavoro. Mostrarle confonderebbe gli utenti. Decisione del
2026-11-23: una scheda sola per tutte; le rimozioni sono state confermate dal committente il
2026-09-25 (B6.4)."""
roles = ["Student", "Moderator", "Docente", "System Manager"]
