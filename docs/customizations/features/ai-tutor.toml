notes = """
- Il tutor risponde con il fornitore e il modello «Chat» della sezione Simulazioni AI
  (resolve_provider("chat")), non con il campo «LLM Model» della sezione Rag Tutor, che oggi non
  è letto da nessuno: vedi la scheda ai-platform.
- L'interruttore AI nasconde solo il pulsante; lato server lo controlla la ricerca nelle lezioni
  (per lo studente con lezioni completate risponde «LMSA is not enabled»), non la ricerca su tutto
  il corso usata per istruttori e moderatori.
- I pulsanti flottanti sono montati una volta nei due layout (DesktopLayout, MobileLayout): al
  merge di v2.61.0 i layout sono stati riscritti e <AiFixedButtons /> va rimesso come ultimo figlio
  del contenitore radice. Il selettore dello z-index dei popover copre sia Radix sia reka-ui
  (frappe-ui 1.0-beta).
- Lo spostamento sopra la barra «Continua» del corso su telefono usa lo store mobileCta (scheda
  course-page-mobile).
- Il contesto si sincronizza dalla rotta con il parametro :courseName; se un merge lo rinomina,
  adeguare aiContext.syncFromRoute."""
