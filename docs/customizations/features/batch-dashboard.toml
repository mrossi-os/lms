	"il progresso dello studente è calcolato, non è una colonna del database; nessun campo proprio",
]
notes = """
- Regola del progetto: una sola chiamata per pagina al caricamento. Il progresso medio per studente è
  stato accorpato a get_batch_certified_count (che restituisce certified_count e students_progress)
  invece di aggiungere una risorsa; le altre chiamate indipendenti vanno segnalate, non rifattorizzate
  senza richiesta.
- Il dettaglio per lezione passa da un endpoint autorizzato per classe perché il Valutatore non può
  leggere direttamente LMS Course Progress.
- Decisione del committente (2026-07-31): la lista delle valutazioni nel riquadro dello studente resta
  visibile al Valutatore, è il suo punto d'ingresso ai risultati; non reintrodurre il filtro tolto in
  65d736aed.
- I quattro endpoint controllano can_author_batch (dalla v2.65.0: amministratori, Moderator, Docente,
  istruttori e valutatori di un corso indicati sulla classe) o is_batch_valutatore;
  export_batch_progress solo il primo. Il ruolo globale Batch Evaluator non basta lato server: la SPA
  gli mostra il menu (isFullAdmin) ma, se non è indicato sulla classe, l'esportazione viene rifiutata.
- L'anello e le fasce sono calcolati lato client, senza chiamate in più. La chiamata upstream
  get_batch_chart_data non si fa più.
- Come nella dashboard del corso, la barra di selezione degli studenti può restare fuori vista in fondo
  al riquadro scorrevole: lasciata com'è.
- Nessun test automatico nostro per questi endpoint. Rimozione e iscrizione degli studenti sono nella
  scheda batch-students."""
