notes = """
- Dal merge di v2.62.0 (2026-09-24) il vecchio LiveClassModal non esiste più: creazione e modifica
  vivono nel modulo instradato upstream pages/Forms/LiveClassForm.vue, dove sono stati riportati
  modifica, promemoria, blocco dopo l'avvio e guardia sul doppio salvataggio (decisione: un solo
  modulo). L'upstream crea senza promemoria: il modulo li salva con una seconda chiamata a
  update_live_class sulla lezione appena creata.
- Gli effetti di una modifica (riprogrammazione Zoom con PATCH, email, notifiche) girano in un job
  accodato dopo il commit: dentro la transazione tenevano il blocco sulla riga e un secondo clic
  falliva con «Record has changed since last read».
- has_value_changed confronta i numeri senza normalizzarli: la SPA manda la durata come stringa e
  ogni salvataggio sembrerebbe un cambio d'orario (riarmerebbe tutti i promemoria). Usare
  normalize_live_class_value per ogni nuovo controllo «il campo è cambiato davvero».
- CustomLMSLiveClass sostituisce after_delete dell'upstream (cancella l'Event con
  ignore_permissions): se l'upstream aggiunge altro ad after_delete, il nostro override lo nasconde.
- I collegamenti «aggiungi al calendario» passano a ogni modello già pronti (google_url, outlook_url,
  ics_url firmato per destinatario): i modelli del Desk scrivono solo {{ variabile }}.
- Il Valutatore solo osservatore: dal 84571a094 al 7d2a68e96 la card gli dava Avvia/Apri e
  start_live_class glielo consentiva; corretto in 7d2a68e96 (Partecipa tramite join_live_class,
  livello osservatore, solo join_url).
- Voci collegate a valutatore-role e docente-role: live-class-valutatore-read e
  live-class-docente-manage. Account Zoom, Google Calendar e orario della riunione Zoom sono nella
  scheda zoom-google-calendar."""
