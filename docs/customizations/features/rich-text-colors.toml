]
data = [
	"nessun campo: il colore vive nel contenuto (EditorJS JSON delle lezioni, HTML dei testi ricchi) come <span class=\"lms-inline-color\" style=...> o come color: var(--prose-color-*) / background-color: var(--prose-highlight-*)",
	"patch os_lms.patches.v0_0_7.convert_lms_inline_color: converte una volta i vecchi elementi <lms-inline-color> di content e instructor_content",
	"allowlist EDITORJS_CUSTOM_TAGS in lms/lms/utils.py (oggi solo lms-inline-color)",
]
