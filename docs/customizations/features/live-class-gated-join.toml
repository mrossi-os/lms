notes = """
- Ci sono due porte. join_live_class (in os_lms/api.py, area oslms-core) serve card, email di invito
  e aggiornamento e home dello studente: richiede il login e applica i livelli host / observer /
  student. live_class_join.join serve .ics, Google Calendar e Outlook: link firmato per
  destinatario, senza login, controlla solo l'avvio e la fine (non la finestra dei 15 minuti) e
  porta tutti al join_url.
- La regola sull'avvio vale solo per gli studenti; imporla lato server è stata la correzione dopo
  che gli studenti entravano su Zoom dal link dell'email senza che il docente avesse avviato.
- La finestra dei 15 minuti è scritta due volte: JOIN_WINDOW_MINUTES_BEFORE in api.py e in
  LiveClassCard.vue. Tenerle allineate.
- La memoria di progetto dice che i link di .ics, Google e Outlook incorporano il link grezzo della
  riunione: non è più vero dal commit a8e3fbcec (OWASP, 2026-10-23), passano dalla porta firmata.
- Restano volutamente invariati: il pulsante Avvia apre direttamente start_url dopo
  start_live_class, e il join_url grezzo resta nel payload delle lezioni della classe perché la
  card controlla Boolean(cls.join_url).
- LiveClassCard.vue è un file nostro ma le ancore dell'ingresso stanno anche nelle card upstream che
  lo montano: dopo ogni merge verificare che i pulsanti puntino ancora alla porta interna.
- La pagina della porta firmata ha logo e nome Salescience scritti nel codice."""
