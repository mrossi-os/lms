id = "trueskills-certificates"
title = "Certificati TrueSkill (Openbadge)"
status = "active"
summary = """
Per i corsi configurati con TrueSkill, a fine corso lo studente riceve un Openbadge emesso dalla
piattaforma TrueSkill (immagine PNG e certificato JSON-LD verificabile) al posto del certificato
PDF interno. L'emissione avviene in background, con un registro di ogni tentativo e un controllo
orario per recuperare le emissioni rimaste in sospeso. Nel profilo lo studente vede e scarica i
suoi badge, compresi quelli che TrueSkill gli ha emesso direttamente. Chi gestisce il corso sceglie
o crea il template TrueSkill dalle impostazioni del corso."""
why = """
Il cliente rilascia certificazioni riconosciute tramite TrueSkill, che richiede il codice fiscale
del destinatario. L'upstream ha solo il certificato PDF interno (Print Format). Decisioni prese con
il cliente: solo Openbadge, solo certificati di corso, emissione asincrona dopo la creazione del
certificato, badge come unico certificato del corso (2026-05-21, 2026-07-08)."""
roles = ["Student", "Gestore", "System Manager", "Moderator", "Course Creator", "Docente"]
behaviour = [
	"la connessione a TrueSkill (attivazione, chiave, indirizzo) si configura nella scheda «TrueSkills API» delle impostazioni, visibile ad amministratori e Gestore; il server rifiuta a chiunque altro, anche a un Moderator, di cambiare quei campi, e solo System Manager e Gestore provano la connessione",
	"nelle impostazioni del corso (Prezzo e certificazione) si attiva «Emetti certificato TrueSkill» e si sceglie il template, caricato da TrueSkill solo con l'interruttore acceso; «+ Crea nuovo template» crea un template Openbadge su TrueSkill e lo seleziona, con un'immagine che può riprendere il disegno del certificato del corso",
	"certificato interno e TrueSkill si escludono per corso: accendere uno spegne l'altro; un corso TrueSkill non manda l'email interna «certificato ottenuto» né apre mai il PDF interno",
	"scegliendo un template TrueSkill che chiede dati obbligatori compare l'avviso con i campi richiesti e il server rifiuta di salvare il corso (controllato solo quando cambiano template o interruttore; con TrueSkill irraggiungibile non blocca)",
	"«Ottieni certificato» è attivo sui corsi TrueSkill completati al 100% anche con il certificato interno spento; lo studente vede un'attesa finché il badge è pronto (fino a circa 30 secondi), poi l'immagine si apre in una nuova scheda; altrimenti un messaggio spiega perché (template con dati obbligatori, servizio non attivo, emissione fallita)",
	"il server non crea il certificato di un corso TrueSkill per uno studente senza codice fiscale: lo studente riceve il messaggio di aggiungerlo al profilo (per chi crea il certificato per conto di altri il messaggio nomina lo studente)",
	"l'emissione parte in background dopo la creazione di ogni certificato di un corso TrueSkill, anche se generato da una classe; se lo stesso studente ha già un badge emesso per lo stesso corso con lo stesso template, il nuovo certificato riusa quel badge senza chiamare TrueSkill; con un template diverso si emette un badge nuovo",
	"ogni emissione lascia un log (in attesa, emesso, fallito, da ritentare) che non contiene mai il codice fiscale; un controllo orario abbina a TrueSkill i log in attesa o da ritentare da oltre 5 minuti senza mai riemettere; il nuovo tentativo manuale crea un log nuovo ed è rifiutato se il certificato ha già un badge emesso",
	"nel profilo, scheda Certificati, i badge TrueSkill si scaricano in PNG o JSON-LD; un rifiuto di TrueSkill diventa un messaggio leggibile",
	"nella stessa scheda compaiono dopo quelli interni i certificati che TrueSkill ha emesso direttamente all'email dell'utente, esclusi quelli già emessi dalla piattaforma; li vedono solo il proprietario del profilo, System Manager e Gestore; il download passa dal server ed è rifiutato per un certificato che la ricerca per quell'email non restituisce",
	"«Nessun certificato» compare solo se non c'è nulla né di interno né di TrueSkill",
	"il log delle emissioni lo scrive solo System Manager e lo legge anche Moderator; il collegamento al log dalla scheda del certificato nel Desk compare solo a chi lo può leggere",
