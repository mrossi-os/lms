notes = """
- Quale template viene servito: Frappe risolve le pagine www scorrendo le app installate dall'ultima
  alla prima, e os_lms è l'ultima. /login quindi usa apps/os_lms/os_lms/www/login.html, e
  lms/www/login.html con lms/www/login.py è codice morto in produzione (analisi del worklog, sezione
  sullo stile della pagina di accesso). Il dizionario seminato in lms/www/login.html per il titolo
  «Message» del dialogo dopo la registrazione non è quindi attivo sul sito.
- Pagine anonime (accesso, registrazione): il dizionario client frappe._messages contiene solo una
  parte delle traduzioni, e senza utente collegato anche {{ _() }} può uscire nella lingua predefinita
  del sito. Per un testo che deve uscire in italiano: seminare frappe._messages o, se non basta,
  scrivere il testo italiano direttamente (memoria web_login_client_dict_gap).
- Il widget della foto profilo in os_lms.js dipende da dettagli interni di Frappe: struttura DOM
  .frappe-control > .form-group > .control-input-wrapper, API frappe.web_form (fields_dict, doc) e
  accept() che trasforma i valori mancanti in "". Non richiamare mai set_input() del controllo Attach
  (su questo modulo cancella tutto il campo e lascia un link nudo): il widget lo sostituisce con un
  setter che scrive solo il valore. Riverificare dopo ogni aggiornamento di Frappe.
- Il template di login è una copia della pagina di Frappe: dopo un aggiornamento di Frappe
  confrontarlo con frappe/www/login.html (il 2026-11-04 i fogli di stile più recenti di Frappe hanno
  rotto l'impaginazione, corretto in os_lms.css). La regola globale input{...!important} di
  os_lms.css per l'accesso si applica anche alle altre pagine web.
- La pagina /me mostra «Delete Account» se Website Settings ha show_account_deletion_link: porta alla
  richiesta standard di Frappe, diversa dall'eliminazione completa della scheda account-deletion.
- La vecchia pagina di invito /new-sign-up rimanda a /login: scheda signup-privacy. I colori della pagina di accesso sono della scheda brand-customize."""
