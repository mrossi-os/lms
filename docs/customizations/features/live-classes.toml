	"alla creazione partono l'email «Lezione dal vivo: <titolo>» agli studenti iscritti, agli istruttori, ai valutatori della classe e a chi l'ha creata, e la notifica «Nuova lezione dal vivo» agli studenti, che porta alla scheda Lezioni della classe",
	"le email di invito, aggiornamento e promemoria hanno i pulsanti Google Calendar, Outlook e «.ics» personali per ogni destinatario; non allegano alcun file .ics",
	"ogni lezione ha promemoria configurabili (valore più Minuti, Ore o Giorni), ciascuno almeno 15 minuti prima dell'inizio (controllato anche dal server); il modulo mostra se un promemoria è già partito",
	"i promemoria partono via email ai soli studenti iscritti, da un controllo eseguito ogni 15 minuti, e mai dopo l'inizio della lezione; un promemoria con l'intervallo cambiato riparte, e un cambio di data, ora o durata li fa ripartire tutti",
	"l'eliminazione chiede conferma con la casella «avvisa gli studenti» attiva per default: se attiva gli studenti ricevono l'email «Lezione annullata» e una notifica; la riunione Zoom e l'evento di calendario collegato vengono cancellati",
