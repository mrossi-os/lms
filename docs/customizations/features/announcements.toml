id = "announcements"
title = "Annunci della classe"
status = "active"
summary = """
Chi gestisce una classe manda annunci a tutta la classe o a studenti scelti. Ogni annuncio arriva come
notifica in piattaforma e, se richiesto, anche come email personale, composta a partire dai modelli
email del cliente senza rovinarne la grafica. Nella scheda Annunci lo studente vede solo gli annunci
indirizzati a lui, mostrati come l'email ricevuta, dieci per pagina."""
why = """
L'upstream manda l'annuncio come un'unica email in copia nascosta, con il campo Rispondi-a
obbligatorio, sempre a tutti gli studenti e senza notifica in piattaforma; l'editor ricco di
frappe-ui cancella gli stili dei modelli email. Il cliente vuole comunicazioni con il proprio
marchio, a gruppi mirati, che gli studenti trovino anche dentro la piattaforma."""
roles = ["Moderator", "Docente", "Batch Evaluator", "Valutatore", "Student"]
behaviour = [
	"il pulsante «Fai un annuncio» compare nell'intestazione della classe solo sulla scheda Annunci e a chi gestisce la classe; il server accetta l'invio solo da Moderator, Docente, Batch Evaluator, System Manager e dagli utenti indicati sulla classe; il Valutatore legge gli annunci ma non li manda",
	"ogni annuncio crea una notifica in piattaforma per ciascun destinatario («Hai un nuovo messaggio in annunci: <classe>») che porta alla scheda Annunci; l'email parte solo con «Invia email insieme alla notifica»",
	"con l'email attiva ogni destinatario riceve una propria email, senza vedere gli altri indirizzi, con mittente l'autore dell'annuncio e risposte indirizzate all'autore; il campo Rispondi-a non c'è più",
	"«Invia a» sceglie fra tutta la classe e studenti specifici, cercati per nome o email; con studenti specifici serve almeno una selezione",
	"il server rifiuta un annuncio con destinatari che non sono studenti della classe",
	"con l'email attiva si sceglie un modello: quelli marcati «Available for Batch Announcements» (se nessuno è marcato, tutti), con preselezionato «Announcement Email Template» se esiste; il modello si usa per l'annuncio e non viene mai modificato",
	"un modello HTML con {{ message }} si compila scrivendo solo il messaggio nell'editor, con anteprima e HTML avanzato; un modello HTML senza segnaposto si modifica come HTML grezzo con anteprima fedele; senza modello HTML o senza email si usa l'editor ricco",
	"nel testo vengono sostituiti solo i segnaposto {{ message }}, {{ announcement_url }}, {{ subject }} e {{ frappe.utils.get_url() }}; qualsiasi altra espressione resta testo e non viene eseguita",
	"nella scheda Annunci ogni annuncio mostra l'oggetto sopra il corpo; un annuncio con HTML da modello email si vede in un riquadro isolato uguale all'email ricevuta, una notifica semplice nella card del tema; le righe vuote si conservano",
	"la scheda Annunci mostra 10 annunci per pagina con Precedente e Successivo",
	"lo studente vede solo gli annunci di cui è destinatario e non riceve gli indirizzi degli altri destinatari; gestori e Valutatore della classe li vedono tutti",
	"tornando alla scheda dopo l'invio, l'elenco riparte dalla prima pagina e mostra subito l'annuncio appena inviato",
]
