name: Dependency Scan

# Software composition analysis (OWASP A03 Software Supply Chain Failures):
# osv-scanner checks every lockfile in the repository against the OSV database
# (GitHub advisories, PyPA, npm and more) and publishes what it finds in the job
# summary and as an artifact.
#
# A finding with CVSS 7.0 or more (high, critical) fails the job, and so does one
# without a score (for example a malicious-package report). Lower ones only warn.
# Accepted exceptions live in osv-scanner.toml, each with a reason and a review
# date after which it is reported again.
#
# The Python dependencies of apps/os_lms are not pinned (no lockfile), so the
# scanner can only match the few that are; the production image's exact versions
# come from the elite-deploy build.

on:
  pull_request:
  push:
    branches: [develop, master, feature/oslms, feature/esg]
  schedule:
    # Mondays 06:00 UTC: new advisories appear without any change to the code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  OSV_SCANNER_VERSION: v2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check
          chmod +x osv-scanner

      - name: Scan lockfiles
        run: |
          status=0
          ./osv-scanner scan source --config osv-scanner.toml --recursive --format json --output osv-results.json . || status=$?
          ./osv-scanner scan source --config osv-scanner.toml --recursive --format markdown . > osv-results.md || true
          {
            echo "## osv-scanner (${OSV_SCANNER_VERSION})"
            echo
            cat osv-results.md
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = nothing found, 1 = vulnerabilities found, anything else = the scan itself failed.
          if [ "$status" -gt 1 ]; then
            echo "osv-scanner failed with exit code $status"
            exit "$status"
          fi
          if [ "$status" -eq 1 ]; then
            # A missing score counts as blocking: it is how malicious packages are reported.
            blocking=$(jq -r '
              .results[]?.packages[]? as $p
              | $p.groups[]?
              | select(((.max_severity | tonumber?) // 10) >= 7)
              | "\($p.package.name)@\($p.package.version): \(.ids | join(", ")) (CVSS \(if (.max_severity // "") == "" then "n/a" else .max_severity end))"
            ' osv-results.json)
            if [ -n "$blocking" ]; then
              {
                echo
                echo "### Blocking findings (CVSS >= 7.0 or unscored)"
                echo
                echo "$blocking" | sed 's/^/- /'
                echo
                echo "Update the dependency, or add a reasoned exception with a review date to osv-scanner.toml."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "$blocking" | while read -r line; do
                echo "::error title=Dependency Scan::$line"
              done
              exit 1
            fi
            echo "::warning title=Dependency Scan::Lower-severity vulnerabilities found, see the job summary"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-scanner-results
          path: osv-results.*
          if-no-files-found: ignore
