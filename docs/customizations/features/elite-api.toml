	"REST API", "API key", "api token", "external integration", "webhook", "before_request", "auth_hooks",
	"lms.auth", "block_endpoints", "validate_auth", "form_dict.cmd", "frappe/app.py", "Settings.vue tabsStructure",
	"progress", "LMS Enrollment progress",
]
data = [
	"doctype Elite API Key (key_name, enabled, expires_on, last_used_on, last_used_ip, revoked_on, revoked_by, secret_hash: solo SHA-256 del segreto; name = prefisso della chiave)",
	"doctype Elite API Access Log (api_key, method, status_code, rows_returned, duration_ms, ip_address, request_params); default_log_clearing_doctypes 90 giorni, registrato in Log Settings dal setup",
	"ruolo Elite API Client (desk_access senza permessi) e utente tecnico disattivato elite-api@elite-api.invalid, da setup.setup_elite_api_client",
	"hook before_request os_lms.os_lms.elite_api.auth.authenticate_request e after_request record_request; endpoint os_lms.os_lms.elite_api.v1.* e admin.list_keys / create_key / revoke_key",
]
tests = [
	"apps/os_lms/os_lms/os_lms/tests/test_elite_api_admin.py",
	"apps/os_lms/os_lms/os_lms/tests/test_elite_api_auth.py",
	"apps/os_lms/os_lms/os_lms/tests/test_elite_api_catalog.py",
	"apps/os_lms/os_lms/os_lms/tests/test_elite_api_keys.py",
	"apps/os_lms/os_lms/os_lms/tests/test_elite_api_students.py",
]
notes = """
- La verifica della chiave deve restare un hook before_request: lms.auth.authenticate gira prima di
  ogni auth_hook di os_lms e blocca /api/method/os_lms.* (block_endpoints). Un header custom serve
  perché una chiave custom in Authorization darebbe 401 da validate_auth.
- Lezione della revisione di sicurezza: frappe/app.py esegue form_dict.cmd PRIMA di instradare
  /api/: con la chiave e un parametro cmd si eseguiva qualsiasi metodo whitelisted come utente
  client. Ogni hook di autenticazione in before_request va verificato su quel ramo.
- Frappe annulla le transazioni di ogni GET e delle richieste fallite: il registro si scrive in
  after_request con commit esplicito. frappe.set_user azzera form_dict (salvato e ripristinato).
- Le query di avanzamento sono SQL letterale (niente f-string, regole semgrep di Frappe); ogni lista
  ha la sua COUNT gemella, tenuta allineata da test_lists_agree_with_the_summaries. Usa il
  massimo progresso per studente e corso (in produzione esistono iscrizioni doppie).
- Lacuna nota: un corso eliminato ma ancora collegato a una classe conta in courses_total senza
  comparire in courses.
- Oltre 20 chiavi rifiutate in un'ora parte un'email di allarme ad Administrator e Gestori (scheda
  degli allarmi di sicurezza, 749104b3f).
- Restavano fuori dal lavoro (2026-09-30): deploy in produzione, creazione della chiave di
  produzione e consegna sicura a TrueSkill, verifica GDPR art. 28 a cura del cliente."""
