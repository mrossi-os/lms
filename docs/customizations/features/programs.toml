id = "programs"
title = "Programmi (percorsi di più corsi)"
status = "active"
summary = """
Un programma raccoglie più corsi in un percorso. Per il cliente il programma ha una descrizione
formattata che gli studenti leggono, si riempie aggiungendo più corsi e più membri insieme (anche
un'intera classe) e si pubblica nel suo insieme: chi ne è membro vede e segue tutti i suoi corsi,
anche quelli non pubblicati da soli. La home dello studente mostra i suoi programmi."""
why = """
Il cliente usa i programmi come percorsi formativi completi da assegnare a gruppi di studenti.
L'upstream non ha la descrizione del programma, aggiunge corsi e membri uno alla volta, nasconde ai
membri i corsi non pubblicati e, da v2.64.0, lascia modificare un programma solo ai suoi autori,
che si cambiano solo dal Desk. Decisioni del cliente del 2026-09-23 (corsi non pubblicati visibili
ai membri) e del 2026-09-30 (programmi gestiti in comune)."""
roles = ["Student", "Moderator", "Course Creator", "Docente", "Gestore"]
