notes = """
- Cadenza approvata il 2026-11-02 (politica AI): giro completo a ogni cambio di prompt del Coach
  (anche dal Desk), di modello, di fornitore o del codice del resoconto; ogni 3 mesi; prima del
  rinnovo ESG (certificato valido fino al 2027-10-28); dopo una segnalazione di trattamento
  ingiusto. Non per ogni nuova simulazione: per quelle c'è la lista di controllo sui criteri.
- Le soglie 6 (quota di punteggi bassi) e 7 (accordo giudice-persona ≥ 80% per domanda) sono nella
  politica; il codice calcola la 6, la 7 si legge dal report del controllo a mano.
- Costi: le esecuzioni devono spendere il meno possibile. Prima di un giro stimare chiamate × token
  e dichiararlo; giudici Gemini senza ragionamento (judges.without_thinking); non rigiudicare tutto
  quando cambia solo una parte. Il 2026-11-02 ~6.400 chiamate ai giudici hanno esaurito il credito
  Gemini.
- Phoenix solo su sviluppo e staging, mai in produzione, con dati sintetici.
- Esiti rilevanti: il Coach dava un punteggio complessivo più basso a chi scrive in italiano L2
  (azione A1), poi il punteggio è calcolato dai criteri (scheda ai-simulations) e dal 2026-11-04 il
  nome dello studente è nascosto al Coach, con tutte le soglie rispettate nei due giri.
- Restano da nominare il responsabile della politica AI e chi compila i fogli di controllo."""
