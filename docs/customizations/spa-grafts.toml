combobox_override_event_api). open-on-click invece di open-on-focus evita che il menu si
riapra quando il Combobox rimette il fuoco sull'input dopo una scelta. Questi binding vanno
riportati agli eventi nuovi solo quando l'override del Combobox verrà riallineato a frappe-ui.
Il wrapper os-link (src/oslms/components/Controls/Link.vue) passa tutto a questo componente.
ATTENZIONE al merge di v2.59.0: l'upstream aggiunge :open="isOpen", imposta isOpen dentro
