id = "course-catalogue"
title = "Catalogo dei corsi"
status = "active"
summary = """
L'elenco dei corsi e le loro card sono adattati al cliente: lo studente vede solo i corsi a cui è
iscritto, la card mostra la durata del corso e se rilascia un certificato invece di iscritti,
istruttori e prezzo, la scheda scelta resta ricordata e il filtro delle categorie segue la scheda
attiva."""
why = """
Per il cliente la durata e la certificazione sono le informazioni utili per scegliere un corso,
mentre numero di iscritti, voto medio (le recensioni sono spente), istruttori e prezzo non servono.
Gli studenti accedono ai corsi tramite le classi e i programmi, quindi le schede pubbliche
«Pubblicati» e «In arrivo» per loro sono rumore. Il filtro delle categorie upstream elencava solo
le categorie dei corsi pubblicati e risultava vuoto nelle altre schede."""
roles = ["Student", "Moderator", "Docente", "Valutatore"]
behaviour = [
	"la card del corso mostra la durata complessiva (somma delle durate delle lezioni) con l'icona dell'orologio, al posto del numero di iscritti",
	"la card mostra l'icona Award quando il corso rilascia un certificato, anche se il certificato è solo TrueSkill; non mostra la stella con il voto medio",
	"la card non ha la fascia inferiore con avatar e nomi degli istruttori, prezzo e icona «Get Certified»",
	"lo studente vede nell'elenco corsi solo la scheda «Iscritto», senza selettore delle schede, anche se aveva salvato un'altra scheda o ne chiede una diversa con ?tab= nell'indirizzo",
	"chi non è né studente né amministratore (Moderator, istruttore, valutatore) vede solo le schede «Pubblicati» e «In arrivo»",
	"la scheda scelta nell'elenco corsi resta selezionata quando si esce e si torna; se non è più disponibile per il ruolo si torna alla prima disponibile",
	"il filtro categoria elenca solo le categorie dei corsi della scheda attiva, sparisce se la scheda non ne ha e si azzera cambiando scheda",
	"chi non può vedere i corsi in bozza non ottiene nemmeno le loro categorie, anche chiedendo published=0 all'endpoint",
	"il filtro Certificazione include anche i corsi che rilasciano solo il certificato TrueSkill",
]
