notes = """
- Il ciclo di vita della sessione è cambiato il 2026-07-16 (3337b7bef, b4e5bcea9): allo scadere del
  tempo la sessione si chiude da sola come completata e un'uscita anticipata è un abbandono, con un
  job ogni 10 minuti che chiude le sessioni inattive da 30. Il 2026-10-29 (134fc3fe7) si è aggiunto
  il tetto di messaggi per sessione (OWASP H-3) e la durata della voce è passata da
  LMSA Settings.realtime_max_session_seconds a LMSA Simulation Limits.voice_max_session_seconds.
  La nota di memoria simulations_natural_close_limits descrive lo stato del 2026-07-10 (nessuna
  chiusura automatica, turni non limitati) ed è superata su questi punti.
- Il tempo attivo esclude la latenza dell'AI; max_turns dello scenario esiste ancora ma guida solo
  il banco di prova automatico (eval/runner.py) e il campo è nascosto nell'editor.
- La direttiva di chiusura «[REGIA] ...» va sia nel system prompt sia, come ultima istruzione, nel
  messaggio dello studente inviato al modello: nel solo system prompt veniva ignorata.
- Regole di accesso tutte in ai/simulations/access.py (decise il 2026-11-03, fase 5 di
  docs/ai-simulator/PIANO-esito-e-punteggio-coach.md). Valutatore e Docente senza Course Creator non
  hanno DocPerm sui doctype delle simulazioni: lavorano solo dalla SPA. Le query sui figli della
  versione del docente devono filtrare parentfield (riusano i doctype figli dell'AI).
- Il prompt del Coach si aggiorna dal codice al migrate solo se il record non è stato modificato dal
  pannello (scheda ai-platform); ogni modifica del prompt, del modello o del fornitore del Coach
  richiede un giro dei test di imparzialità prima del rilascio (scheda ai-bias-tests).
- Sul sito di sviluppo simulations_enabled è spento e i test cancellano sessioni, resoconti e schemi:
  per le prove nel browser servono dati di esempio e l'interruttore va rimesso com'era.
- Voci collegate: course-detail-simulations-tab, router-simulation-routes (merge v2.61/v2.62:
  rotte riaggiunte in coda a routes.js con marcatore)."""
