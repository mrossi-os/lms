id = "ai-simulations"
title = "Simulazioni AI (chat e voce)"
status = "active"
summary = """
Lo studente si allena in una conversazione con un personaggio interpretato dall'AI (per esempio un
cliente in una trattativa), in chat o a voce, partendo dal pulsante flottante del corso. Alla fine
il Coach AI scrive un resoconto con un punteggio indicativo per criterio, punti di forza, cose da
migliorare e lezioni consigliate. Docenti, valutatori e gestori preparano gli scenari e gli schemi
di valutazione, rivedono le sessioni e pubblicano una propria versione del resoconto; nelle
simulazioni «con esito» sono loro, mai l'AI, a decidere se lo studente l'ha superata. I limiti
d'uso per studente si impostano dalla piattaforma."""
why = """
Richiesta del cliente per la formazione commerciale: esercitare colloqui realistici con un
riscontro immediato. L'upstream non ha nulla di simile. La revisione umana e la decisione
dell'esito da parte di una persona discendono dalla politica AI (AI Act, certificazione ESG del
2026-10-28) e dai test di imparzialità sul Coach (scheda ai-bias-tests)."""
roles = ["Student", "Docente", "Course Creator", "Valutatore", "Gestore", "System Manager", "Moderator"]
