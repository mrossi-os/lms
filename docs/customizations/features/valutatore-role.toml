id = "valutatore-role"
title = "Ruolo Valutatore (per classe)"
status = "active"
summary = """
Il Valutatore è una persona assegnata a una o più classi per seguirne gli studenti: vede la
dashboard, le lezioni dal vivo, gli annunci e le discussioni della sua classe, legge i corsi
della classe e le risposte ai quiz e corregge i compiti degli studenti iscritti. Tutto in sola
lettura tranne la correzione dei compiti, e solo per le classi che gli sono assegnate."""
why = """
Il cliente ha bisogno di valutatori esterni o interni che correggano il lavoro di una classe
senza diventare istruttori né vedere le altre classi. L'upstream non ha un ruolo limitato a una
classe: il Batch Evaluator legge tutte le classi e il Course Creator gestisce i propri corsi.
Decisione del 2026-06-09, regole confermate ai merge di v2.64.0 e v2.65.0 e nella matrice dei
ruoli del cliente del 2026-10-05."""
roles = ["Valutatore", "Moderator", "Batch Evaluator", "Docente", "Gestore"]
behaviour = [
