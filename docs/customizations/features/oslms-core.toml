id = "oslms-core"
title = "Ossatura dell'app os_lms e compatibilità con l'upstream"
status = "active"
summary = """
L'app os_lms è l'estensione che contiene quasi tutto il codice nostro lato server. Questa scheda
copre i file condivisi da molte funzionalità: la registrazione dell'app (hooks.py), le operazioni a
ogni migrate (setup.py), i campi custom e l'elenco delle patch, i grandi moduli api.py,
override_api.py e override_utils.py che sostituiscono metodi dell'upstream, i ponti verso metodi
che Frappe non ha, le cascate di cancellazione di utenti e lezioni. Non è una funzione per
l'utente: è ciò che deve restare compatibile a ogni release dell'upstream."""
why = """
Tenere il codice nostro in un'app separata evita i conflitti di merge, ma la lega alle API
dell'upstream: os_lms sostituisce decine di metodi whitelisted di lms e Frappe, e un merge può
romperli senza che build, rilevatore delle ancore o test del frontend se ne accorgano (v2.62.0 ha
tolto un helper importato da override_api.py e per due release l'intero modulo non si importava)."""
roles = []
behaviour = [
	"os_lms richiede l'app lms e a ogni migrate abilita l'italiano, crea i campi custom mancanti, toglie quelli dismessi, riscrive ruoli e permessi custom (Valutatore, Gestore, Docente, Course Creator sulle classi, registro di sorveglianza), prepara il client Elite API, l'indice vettoriale Redis (se configurato), l'indice di ricerca e i modelli di prompt AI, e cifra le chiavi API e i token Google rimasti in chiaro",
	"40 metodi whitelisted di lms e Frappe sono sostituiti da versioni os_lms (override_whitelisted_methods, più il ponte qui sotto); ogni sostituto si importa e accetta tutti i parametri dell'originale, e test_override_signatures fallisce se uno smette di risolversi o ne scarta uno",
	"la richiesta frappe.utils.telemetry.pulse.client.boot_config che frappe-ui 1.0.0-beta.29 fa a ogni caricamento della SPA riceve «telemetria spenta» invece di un 417; il test fallisce quando Frappe introduce il metodo originale, e allora il ponte va tolto",
	"l'autorizzazione di Google Calendar apre un popup che conserva il collegamento alla finestra principale, così la configurazione si chiude da sola al ritorno; il visualizzatore dei certificati apre una scheda vuota già al clic (non bloccata dai blocchi dei popup) e la indirizza quando il badge TrueSkills è pronto; entrambi gli indirizzi passano per safeUrl",
	"eliminare un utente non si blocca per i collegamenti: i suoi record LMS personali vengono cancellati, le righe che lo nominano come istruttore o membro di programma vengono tolte lasciando corsi e programmi, e nei record altrui in cui ha solo agito (correzioni, host di una lezione dal vivo, scenari scritti...) il riferimento passa ad Administrator o viene svuotato",
	"eliminare una lezione cancella i suoi tempi di visione, avanzamenti, note e registri del tutor, stacca quiz, iscrizioni e consegne che la nominano e toglie i suoi vettori dall'indice AI senza che un problema dell'AI blocchi l'eliminazione",
	"il server rifiuta di salvare una lezione in cui un blocco «upload» punta fuori dai file caricati (es. /private/../site_config.json); sono ammessi i file del sito e i link http/https",
