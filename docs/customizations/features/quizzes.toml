id = "quizzes"
title = "Quiz"
status = "active"
summary = """
Lo studente può consegnare un quiz anche lasciando domande senza risposta e da qualunque domanda;
le domande saltate valgono 0 punti, a meno che il quiz non chieda di penalizzarle. Il tempo dei quiz
a tempo segue l'orologio reale e la consegna avviene una sola volta. Il server impedisce di gonfiare
il punteggio, e quiz, liste e moduli hanno l'aspetto e le etichette in italiano voluti dal cliente."""
why = """
Nell'upstream una domanda saltata faceva fallire l'intera consegna: lo studente restava bloccato.
Il conto alla rovescia rallentava nelle schede in secondo piano e la consegna automatica allo scadere
non partiva. L'audit di sicurezza ha trovato che uno studente poteva ripetere la stessa risposta fino
a superare il quiz (e ottenere lezione, certificato e badge) o riscrivere la propria consegna. Il
cliente vuole i radio button classici e le etichette tradotte."""
roles = ["Student", "Moderator", "Course Creator", "Docente"]
