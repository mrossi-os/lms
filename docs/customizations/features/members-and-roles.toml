notes = """
- La regola su chi assegna i ruoli è applicata solo dal server (assert_can_assign_role in
  override_api, usata da save_role e create_member): la SPA mostra ancora gli interruttori al
  Moderator (ProfileRoles.vue, NewMemberModal, MemberForm). Nasconderli è un innesto in sospeso.
- create_member riconcilia tutti i ruoli nella stessa richiesta dell'inserimento perché il
  before_insert dell'LMS aggiunge sempre LMS Student. Il test upstream memberFormRoute.test.ts che si
  aspetta frappe.client.insert diverge da questa regola.
- Al merge di v2.62.0 l'upstream ha spostato Impostazioni → Membri sul modulo instradato
  pages/Forms/MemberForm.vue con il nuovo endpoint get_member, perdendo in silenzio le regole: dopo
  ogni riscrittura dei moduli membri ricontrollare ruolo Valutatore, create_member e il rifiuto senza ruoli.
- EditMemberModal.vue (con il codice fiscale) oggi non è importato da nessun componente: la modifica
  apre NewMemberModal in modalità modifica e in Members.vue restano variabili non più usate. Il codice
  fiscale vive nella scheda profile-page.
- La vista studente è fedeltà di presentazione, non un confine di sicurezza: i permessi del server
  restano quelli reali. Non esiste un flag is_gestore nella vista studente: il Gestore passa dai ruoli.
- Il ruolo Valutatore assegnato da qui è globale; quello concesso dalla classe non viene mai revocato
  in automatico (scheda valutatore-role)."""
