notes = """
- Il codice fiscale non passa da get_profile_details: il modulo lo legge a parte con
  frappe.client.get_value sul proprio record e lo confronta a parte per lo stato «modificato».
- Dal 2026-09-25 un corso TrueSkill non emette il certificato senza codice fiscale
  (MissingFiscalIdError); il messaggio allo studente rimanda a questa modifica del profilo. Lo usano
  anche Elite API e importazione delle iscrizioni.
- Dal merge di v2.62.0 la modifica non è più una modale (EditProfile.vue eliminata) ma la pagina
  instradata upstream pages/Forms/ProfileEditForm.vue: colonna unica, campi nascosti e codice fiscale
  riportati lì.
- Due voci accepted-drift: profile-own-without-lms-role (get_profile_details upstream consente il
  proprio profilo e rifiuta il permesso prima del controllo di esistenza, così chi non ha un ruolo
  LMS non scopre quali username esistono) e profile-edit-image-optional.
- In Profile.vue restano EditCoverImage e la risorsa coverImage importati ma non usati.
- L'eliminazione del proprio account dal profilo è nella scheda account-deletion; i certificati
  TrueSkill ricevuti nella scheda Certificati sono in trueskills-certificates."""
