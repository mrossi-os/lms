id = "notifications"
title = "Notifiche in piattaforma"
status = "active"
summary = """
Il clic su una notifica apre la pagina giusta della piattaforma (lezione, quiz, classe, consegna,
simulazione) oppure avvisa che non è più disponibile, invece di non fare nulla o finire su una pagina
sbagliata. Le notifiche dei punteggi dei quiz ricevono una destinazione, e nelle schede della classe
un contatore rosso mostra quante notifiche non lette riguardano lezioni, annunci e discussioni."""
why = """
Il pannello upstream leggeva i link a posizioni fisse: con link assoluti, prefisso /lms o frammenti
di scheda apriva la pagina sbagliata o andava in errore, e l'avviso del punteggio di un quiz nasce
upstream senza link, quindi il clic non faceva nulla. Il cliente vuole che lo studente veda subito
dove c'è qualcosa di nuovo nella sua classe."""
roles = ["Student", "Moderator", "Docente", "Valutatore"]
behaviour = [
	"le schede Da leggere e Lette del pannello notifiche sono in italiano anche dopo un ricaricamento completo della pagina",
	"il clic su una notifica funziona con link assoluti o relativi, con o senza il prefisso /lms, e porta il frammento della scheda (per esempio #discussions) nella pagina aperta",
	"una notifica che punta a una lezione (courses/<corso>/learn/<capitolo>-<lezione>) apre direttamente la lezione; una che punta a un quiz autonomo apre la pagina del quiz; una classe apre la pagina della classe; una consegna di compito apre la consegna",
	"ogni altro link che nomina una pagina della piattaforma la apre con i suoi parametri (così si aprono le notifiche delle simulazioni AI per revisori e studenti)",
	"una notifica con link sconosciuto o non più valido (documento cancellato, pagina rimossa) mostra l'avviso «Impossibile aprire questa notifica» invece di un errore",
	"la notifica del punteggio di un quiz, che l'upstream crea senza link, porta alla lezione che contiene il quiz, oppure alla pagina del quiz se è autonomo; mai alla pagina della consegna, che mostrerebbe le risposte corrette",
