# Inventario delle personalizzazioni marcate OSLMS-CUSTOM.
#
# Fonte di verità unica: da qui si genera la verifica dopo ogni merge upstream.
# Chi aggiunge una personalizzazione aggiunge anche la voce, nella stessa sessione.
# Schema e criteri: vedi README.md in questa cartella.

schema_version = 1
area = "spa-grafts"

# ---------------------------------------------------------------------------
# Card laterale del corso (CourseCardOverlay.vue)
# ---------------------------------------------------------------------------

[[entries]]
id = "course-card-admin-gate"
title = "Menu di gestione sulla card corso visibile anche al Docente"
layer = "spa-graft"
confidence = "high"
intent = """
Il ruolo custom Docente è un istruttore globale: deve essere trattato come amministratore
del corso sulla card (niente CTA di iscrizione, azioni di gestione) esattamente come
Moderator e l'istruttore del corso. L'upstream conosce solo Moderator e istruttore."""

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "Boolean(user.data?.is_docente)"
  symbol = "isAdmin"

  [entries.visibility]
  subject = "trattamento da amministratore sulla card corso"
  allow = ["Moderator", "Docente", "course-instructor"]
  deny = ["Student", "Valutatore", "Guest"]

[[entries]]
id = "course-card-valutatore-no-enroll"
title = "Nessuna CTA di iscrizione per il Valutatore"
layer = "spa-graft"
confidence = "high"
intent = """
Il Valutatore di un batch che contiene il corso lo consulta in sola lettura e non è mai
uno studente. Raggiunge le lezioni senza iscrizione: offrirgli la CTA di iscrizione è una
trappola, perché un click crea una LMS Enrollment reale e lo elenca tra gli studenti.
Il flag is_valutatore è iniettato dall'override os_lms di get_course_details."""

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "Boolean(props.course.data?.is_valutatore)"
  symbol = "isValutatore"

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "!isAdmin.value && !isValutatore.value"
  symbol = "canEnroll"

  [[entries.sites]]
  file = "frontend/src/types/api.ts"
  anchor = "is_valutatore?: 0 | 1"

  [entries.visibility]
  subject = "CTA di iscrizione / acquisto sulla card corso"
  allow = ["Student", "Guest"]
  deny = ["Valutatore", "Moderator", "Docente", "course-instructor"]

[[entries]]
id = "course-card-certificate-dedup"
title = "Niente doppio pulsante certificato dopo l'emissione"
layer = "spa-graft"
confidence = "high"
intent = """
Una volta emesso il certificato deve restare solo il «View Certificate» di
CertificationLinks, non anche un «Get Certificate». LMS Enrollment.certificate non viene
valorizzato all'emissione, quindi la fonte autorevole è get_certification_details (lo
stesso segnale che usa CertificationLinks); si attende il caricamento per evitare flash."""

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "url: 'lms.lms.api.get_certification_details'"
  symbol = "certification"

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "!certification.data.certificate"
  symbol = "canGetCertificate"

[[entries]]
id = "trueskills-certificate-viewer"
title = "Il certificato TrueSkills sostituisce il PDF interno"
layer = "spa-graft"
confidence = "high"
intent = """
Per i corsi con emissione TrueSkills il certificato di completamento è l'immagine
openbadge TrueSkills (aperta in linea), non il PDF del Print Format interno. Vale sulla
card corso e nella pagina certificati del profilo; i certificati interni o di batch
continuano ad aprire il PDF. TrueSkills è alternativo al certificato interno, quindi il
pulsante si abilita anche con enable_certification spento.
Merge di v2.61.0 (2026-09-23): l'upstream trasforma la scheda certificato del profilo in <a :href=PDF>; tenuta la nostra div cliccabile (il clic passa da useCertificateViewer e la scheda contiene i pulsanti openbadge, che non possono stare dentro un link). Accessibilità da tastiera (role=button, tabindex) da valutare a parte."""

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "openCourseCertificate(props.course.data?.name)"
  symbol = "fetchCertificate"

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "props.course.data?.trueskills_certificate_enabled"
  symbol = "canGetCertificate"

  [[entries.sites]]
  file = "frontend/src/pages/ProfileCertificates.vue"
  anchor = "const { openIssuedCertificate } = useCertificateViewer()"

  [[entries.sites]]
  file = "frontend/src/types/lms/LMSCourse.ts"
  anchor = "trueskills_certificate_enabled?: 0 | 1"

  [[entries.sites]]
  file = "frontend/src/pages/ProfileCertificates.vue"
  anchor = "<!-- OSLMS-CUSTOM: a clickable div, not upstream's <a href> to the PDF"

[[entries]]
id = "course-card-outline"
title = "Programma del corso navigabile al posto delle statistiche"
layer = "spa-graft"
confidence = "high"
intent = """
La card mostra il programma del corso (CourseOutline) navigabile al posto del blocco
«This course includes» con le statistiche, che resta commentato nel file per un facile
ripristino insieme alle sue computed e alle icone importate."""

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "<div v-if=\"!hideOutline\" :class=\"readOnlyMode ? 'mt-4' : 'mt-0'\">"

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "OSLMS-CUSTOM: \"This course includes\" stats block disabled"

# ---------------------------------------------------------------------------
# Trattamento mobile della pagina corso
# ---------------------------------------------------------------------------

[[entries]]
id = "course-mobile-cta-bar"
title = "Barra fissa «Continue Learning» su telefono"
layer = "spa-graft"
confidence = "high"
intent = """
Sul telefono (<640px, MobileLayout con barra di navigazione in basso) lo studente iscritto
vede una barra fissa a tutta larghezza con «Continue Learning», che diventa l'unica azione
primaria; il pulsante nella card viene nascosto. La pagina aggiunge padding in fondo per
non coprire l'ultima sezione, e pubblica la presenza della barra nello store mobileCta
così che i pulsanti AI flottanti si sollevino invece di sovrapporsi. Soglia 640 e non 768
per restare dentro la shell telefono.
Adeguamento post-merge v2.62.0 (2026-09-24): la nuova barra di navigazione mobile upstream è alta 62px (misurata, prima ~48) più l'area sicura del telefono, e la CTA fixed bottom-12 la copriva; la variante standalone:bottom-16 non è mai stata generata (variante non registrata). La CTA ora è sticky bottom-0 nel flusso della pagina: l'area di scorrimento termina esattamente sopra la barra, quindi resta sopra qualunque sia l'altezza, e occupa il proprio spazio (padding pb-36 non più necessario). I pulsanti AI flottanti usano offset calcolati su 62px + env(safe-area-inset-bottom) (5rem senza CTA, 9rem con CTA)."""

  [[entries.sites]]
  file = "frontend/src/overrides/pages/Courses/CourseOverview.vue"
  anchor = "() => isMobile.value && Boolean(props.course.data?.membership)"
  symbol = "showMobileCta"

  [[entries.sites]]
  file = "frontend/src/overrides/pages/Courses/CourseOverview.vue"
  anchor = "<div v-if=\"showMobileCta\" class=\"sticky bottom-0 z-30 p-3\">"

  [[entries.sites]]
  file = "frontend/src/overrides/pages/Courses/CourseOverview.vue"
  anchor = "mobileCta.setBar(visible)"

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "v-if=\"!hideContinueCta\""

  [[entries.sites]]
  file = "frontend/src/stores/mobileCta.js"
  anchor = "defineStore('mobile-cta'"

  [[entries.sites]]
  file = "frontend/src/oslms/components/AiFixedButtons.vue"
  anchor = "? 'bottom-[calc(9rem+env(safe-area-inset-bottom))] sm:bottom-6'"

[[entries]]
id = "course-mobile-outline-bottom"
title = "Programma del corso in fondo alla pagina su telefono"
layer = "spa-graft"
confidence = "high"
intent = """
Sul telefono (<640px) il programma del corso si sposta in fondo alla pagina, sotto le
sezioni di contenuto, e viene tolto dalla card (hideOutline). In ogni layout più largo
resta nella card, quindi il rendering in fondo è condizionato alla shell telefono per non
duplicare il programma."""

  [[entries.sites]]
  file = "frontend/src/overrides/pages/Courses/CourseOverview.vue"
  anchor = "<section v-if=\"isMobile\">"

  [[entries.sites]]
  file = "frontend/src/overrides/pages/Courses/CourseOverview.vue"
  anchor = "const isMobile = computed<boolean>(() => size.width < 640)"

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "hideOutline?: boolean"

[[entries]]
id = "course-card-hide-when-empty"
title = "La card corso sparisce quando resterebbe vuota"
layer = "spa-graft"
confidence = "high"
intent = """
Su telefono programma e CTA escono dalla card, che può rimanere senza contenuto: invece di
un riquadro vuoto con bordo la card non si rende. Per saperlo replica la visibilità di
CertificationLinks usando la stessa risorsa certification."""

