notes = """
- Il ruolo è solo il contenitore delle DocPerm: il restringimento alla classe lo fanno le
  get_permission_query_conditions e i veti has_permission di os_lms.valutatore, che Frappe mette in
  AND con quelli dell'upstream. Ogni nuovo filtro di lista upstream (v2.62.0 classi e live, v2.64.0
  progressi, v2.65.0 consegne e iscrizioni) ha svuotato le liste del Valutatore finché la regola non
  è stata scritta dentro il filtro upstream: è il primo controllo da fare dopo un merge.
- Un hook has_permission deve restituire True nel caso neutro e False solo per vietare: in questa
  versione di Frappe None vale come rifiuto (ha bloccato la creazione di ogni LMS Enrollment).
- frappe.db.escape(v, percent=False) mette già gli apici: non aggiungerne altri nelle IN.
- PRIVILEGED_ROLES: aggiungere Valutatore solo all'insieme locale di lms_assignment_submission.py,
  mai a quello condiviso di lms/lms/utils.py (darebbe poteri su certificati e progressi). Senza,
  la correzione dà 403 su frappe.client.set_value o viene riportata in silenzio ai valori salvati.
- Consegne dei quiz: mai filtrare sul campo course della consegna (copiato all'inserimento, vuoto se
  il quiz è stato collegato dopo); il quiz si risolve com'è collegato oggi.
- Decisione 2026-07-31, da non annullare: il Valutatore arriva alle risposte di quiz e compiti dei
  suoi studenti dalla dashboard della classe. Il registro di sorveglianza con foto gli è aperto dal
  2026-10-05 (ribaltata la decisione del 2026-09-24).
- Bundle reale: il Valutatore ha SOLO il ruolo Valutatore; è questo che lo tiene «puro»
  (_only_scoped_valutatore). Con ruoli più ampi le restrizioni non si applicano.
- Lacuna nota: get_course_count / get_batch_count non sono ristretti per il Valutatore (solo il totale).
- Voci condivise: batch-list-valutatore-docente e proctoring-log-hidden-from-valutatore sono qui;
  course-lesson-list-mirrors-read-gate e i test v2.64/v2.65 sono nella scheda docente-role. Le lezioni
  dal vivo (pulsante Partecipa da osservatore) sono nelle schede live-classes e live-class-gated-join."""
