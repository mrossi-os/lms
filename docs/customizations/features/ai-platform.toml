notes = """
- Il campo «LLM Model» della sezione Rag Tutor non è letto da nessuno: lo usa solo GptChatbot, che
  nessun codice chiama. Tutor e simulazioni rispondono con il fornitore e il modello «Chat» delle
  Simulazioni AI (resolve_provider("chat")). Vedi i dubbi del lotto 4.
- La temperatura del Coach impostata dal Desk viene ignorata: _ask_llm passa 0.2 (rilevato il
  2026-11-02, non cambiato).
- Sincronizzazione dei prompt e cifratura delle chiavi sono in after_migrate e non in patch, perché
  il deploy di staging segna come eseguite le patch nuove senza lanciarle: dopo un deploy su staging
  verificare con SELECT che l'effetto ci sia.
- PREVIOUS_FINGERPRINTS in prompt_sync.py elenca i testi passati del codice (e quelli salvati dal
  pannello su staging) che il migrate può sostituire: un testo modificato a mano non va aggiunto
  lì, altrimenti verrebbe sovrascritto.
- La scheda Prompt AI era solo per amministratori (27f046d7c, 2026-07-14), poi aperta ai Gestore
  con canManageOsIntegrations; il Gestore salva perché ha sempre Moderator, che ha la DocPerm.
- Un cambio di fornitore, modello o prompt del Coach richiede un giro dei test di imparzialità
  prima del rilascio (politica AI, scheda ai-bias-tests)."""
