notes = """
- Ogni merge che tocca il blocco Pagamenti di Settings.vue tende a reintrodurlo (anche con gli import
  di PaymentGateways, Coupons e Transactions): va riscartato. Al merge di v2.58.0 il nostro
  Settings.vue era stato tenuto proprio per questo.
- Le rimozioni consistono nel commentare o togliere blocchi upstream: le ancore sono i commenti. I
  componenti restano nel codice (BatchFeedback ancora importato nella dashboard del gestore,
  CourseReviews, i moduli dei coupon).
- Lato server enforce_server_managed_fields riporta comunque purchased_certificate a falso per chi
  non ne ha diritto; nel nuovo CourseEnrollmentForm (v2.62.0) la casella è stata ricommentata e il
  test upstream courseEnrollmentForm.test.ts la tocca.
- Nascondere non spegne: offerte di lavoro, coupon e recensioni restano raggiungibili dall'indirizzo
  e dalle API. Le letture delle recensioni sono comunque limitate dall'override di sicurezza
  get_reviews (scheda security-hardening).
- In CouponDetails.vue manca class="w-full" sulla tendina Tipo di sconto: residuo di merge, non
  voluto.
- Il campo Pagamento tolto dall'iscrizione alla classe è nella scheda batch-students."""
