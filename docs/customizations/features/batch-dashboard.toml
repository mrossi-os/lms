id = "batch-dashboard"
title = "Dashboard della classe: progressi ed esportazione"
status = "active"
summary = """
La dashboard di una classe dice a chi la segue come vanno gli studenti: l'avanzamento di ciascuno,
la distribuzione dei progressi, il completamento per corso e per lezione, e il dettaglio di ogni
studente fino alla singola lezione. Chi gestisce la classe può scaricare i progressi in Excel o in
CSV; il Valutatore della classe vede tutto ma non esporta."""
why = """
Il cliente deve rendicontare l'avanzamento delle classi (anche verso enti e committenti) e analizzare
i dati con l'AI. L'upstream mostrava un grafico riassuntivo e una lista studenti senza progresso,
non ordinabile e senza esportazione; le sue statistiche per corso contano tutti gli iscritti al
corso, non solo gli studenti della classe."""
roles = ["Moderator", "Batch Evaluator", "Docente", "Course Creator", "Valutatore"]
behaviour = [
	"la lista studenti della dashboard ha una colonna Progresso con barra e percentuale, pari alla media dei progressi dello studente sui corsi della classe",
	"le intestazioni nome, progresso e data di iscrizione della lista studenti si cliccano per ordinare in modo crescente o decrescente; nome e data restano ordinati anche dopo «Carica altri», il progresso si ordina sulle righe già caricate",
	"al posto del grafico «Batch Summary» dell'upstream la dashboard mostra un anello «Riepilogo progressi» che divide gli studenti in Appena iniziato, In corso, Avanzato e Completato, con le stesse fasce della dashboard del corso",
	"il pannello del progresso dei corsi ha un selettore: senza corso mostra la media di ogni corso fra gli studenti della classe, con un corso mostra il completamento di ogni lezione; le percentuali contano solo gli studenti della classe",
	"il menu «Esporta statistiche» scarica un Excel leggibile (una riga per studente e corso iniziato, con corsi iniziati e non iniziati e lezioni completate e da completare; anche gli studenti senza corsi iniziati hanno una riga) oppure un CSV grezzo con una riga per studente, corso e lezione, pensato per l'analisi con l'AI",
	"il menu di esportazione compare a Moderator, Batch Evaluator, Docente e a chi gestisce la classe, non al Valutatore; il server esporta solo per amministratori, Moderator, Docente e istruttori o valutatori di un corso indicati sulla classe, e rifiuta tutti gli altri, Valutatore compreso",
	"cliccando uno studente, il riquadro dei progressi ha un selettore di corso: «Tutti i corsi» mostra la media per corso, un corso mostra il dettaglio per lezione (capitolo.lezione, titolo, completata o da fare), caricato solo quando lo si sceglie",
	"nel riquadro dello studente la lista delle valutazioni (quiz e compiti) resta visibile anche al Valutatore della classe; intestazioni, stato dei compiti e badge «Completato» sono in italiano",
