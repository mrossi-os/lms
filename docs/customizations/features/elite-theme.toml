id = "elite-theme"
title = "Tema grafico Elite"
status = "active"
summary = """
Il foglio di stile del cliente, caricato sopra quello di frappe-ui, dà alla piattaforma l'aspetto
Elite: card con sfondo, bordo e angoli arrotondati, campi dei moduli ed editor con lo stesso
sfondo grigio, intestazioni degli elenchi colorate, barre di scorrimento sottili, intestazione di
pagina grigia e barra laterale senza il bordo e lo sfondo dell'upstream. Molte pagine upstream
portano piccole classi di aggancio (card, os-multilink, ProseMirror-wrapper) che il tema usa."""
why = """
Il cliente ha un'identità visiva propria, diversa dallo stile neutro dell'upstream. I colori
variabili per istanza sono nella scheda brand-customize; questa scheda copre la parte fissa del
tema, uguale per tutte le istanze, e gli agganci che servono per applicarla."""
behaviour = [
	"il tema Elite (styles/theme/elite/main.css) è importato dal foglio di stile globale della SPA: senza quell'import l'intera interfaccia torna allo stile upstream",
	"gli elementi con la classe card (riquadri numerici delle dashboard di corso, classe e statistiche video, card dei programmi per amministratore e studente) hanno sfondo elevato, bordo grigio chiaro, angoli arrotondati e spaziatura interna",
	"campi di testo, date, numeri, password, aree di testo, campi di collegamento ed editor di testo hanno tutti lo stesso sfondo grigio (surface-gray-2); nel modulo del corso valgono anche per l'editor della descrizione, per «Corsi correlati» e per «Istruttori»",
	"negli elenchi e nelle tabelle con le classi del tema l'intestazione usa il colore di intestazione delle tabelle (grigio se non impostato) e le righe il colore aziendale (trasparente se non impostato)",
	"il contenitore della barra laterale su desktop non ha il bordo né lo sfondo dell'upstream (colore e bordo vengono dal tema); la sfumatura che stava davanti è stata tolta il 2026-09-25 su decisione del committente",
