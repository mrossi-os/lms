id = "security-hardening"
title = "Sicurezza applicativa (OWASP)"
status = "active"
summary = """
Insieme di difese trasversali nate dalla revisione OWASP Top 10 dell'ottobre 2026: controlli di
accesso comuni per le funzioni che leggono le lezioni o spendono credito dei fornitori AI, limiti
per utente, HTML incollato negli editor reso innocuo, tempi massimi sulle chiamate esterne,
dipendenze del frontend sopra le versioni vulnerabili, raccolta delle violazioni della Content
Security Policy, allarmi via email sugli attacchi ed esportazione dei corsi senza file privati
altrui. Le correzioni che riguardano una singola funzione stanno nella sua scheda."""
why = """
Requisito della certificazione ESG (punto 4 del piano del 2026-10-23): chiudere i rilievi della
revisione OWASP Top 10. L'upstream lascia alcune lacune che riguardano tutto il sito: whitelist
che vuol dire solo «utente collegato», chiamate HTTP senza timeout, HTML degli appunti interpretato
nella pagina viva, file privati di altri utenti finiti negli ZIP dei corsi, nessun allarme sui
tentativi di accesso ripetuti."""
roles = ["System Manager", "Gestore"]
behaviour = [
	"in entrambi gli editor di frappe-ui (TextEditor classico e nuovo editor) l'HTML incollato viene letto in un documento inerte: un elemento come <img src=x onerror=...> incollato non esegue codice; se frappe-ui cambia i suoi gestori di incolla la build fallisce di proposito",
	"il tutor AI e il flusso video della lezione per l'app (link HLS firmato di Vimeo) rispondono su un corso solo a chi lo segue (chi può modificarlo, Valutatore di una sua classe, iscritto) e, per una lezione, solo se lo studente potrebbe aprirla in quel momento (vale anche il blocco delle lezioni in sequenza); essere pubblicato non basta",
	"le chiamate che consumano credito dei fornitori (tutor, trascrizione e sintesi vocale, voce in tempo reale, simulazioni, indicizzazione, rinnovo del flusso Vimeo) hanno un limite per utente, non per indirizzo IP; oltre il limite rispondono «Too many requests»",
	"le chiamate dell'upstream verso servizi esterni hanno un tempo massimo (geolocalizzazione della registrazione 3 s, cambio valuta e Unsplash 10 s, Zoom 15 s); un errore della geolocalizzazione lascia l'utente senza paese invece di far fallire la registrazione",
	"l'esportazione ZIP di un corso è riservata a chi può modificarlo e include un file privato solo se chi esporta potrebbe scaricarlo o se la lezione del corso lo serve ai suoi studenti; i file scartati sono annotati nel log lms.security",
	"le anteprime di immagini e video locali (blob: o data:) accettano solo formati raster e video, mai un'immagine SVG in data:",
	"le dipendenze del frontend non scendono sotto le versioni minime di sicurezza (fra le altre DOMPurify 3.4.17, markdown-it 14.3.3, socket.io-client 4.8.4, vue 3.5.44, vite 5.4.21, prosemirror-model 1.25.12, tiptap 3.32.0): un test lo verifica sul yarn.lock e la scansione delle dipendenze blocca le pull request; ogni eccezione accettata ha un motivo e una data di revisione",
	"l'indirizzo /csp-report raccoglie le violazioni della Content Security Policy (inviata in Report-Only da nginx) come contatori per direttiva, sorgente bloccata, pagina e modalità, senza utente, IP, parametri né frammenti di codice; al massimo 20 report per richiesta e 500 tipi diversi; le righe si vedono solo da System Manager e si cancellano dopo 90 giorni",
	"ogni 5 minuti il sito controlla gli accessi falliti (oltre 20 in 10 minuti) e le chiavi Elite API rifiutate (oltre 20 in un'ora): oltre la soglia l'utente Administrator e i Gestori ricevono un'email con gli IP e gli utenti più frequenti, al massimo una per ora per tipo di allarme",
]
