notes = """
- Il blocco del quiz è perso già una volta (merge upstream 1f5978236 del 2026-06-04) e ripristinato il
  2026-09-07 in d88fc97f4: senza le schermate in Lesson.vue gli interruttori restano configurabili ma
  non fanno nulla. Le condizioni sono innestate sulle catene v-if esistenti per tenere piccolo il
  conflitto.
- Decisione del committente al merge di v2.62.0 (F5): l'ordine delle lezioni lo impone l'upstream lato
  server; nostro resta solo il blocco del quiz. Le chiavi lesson_access ed enforce_lesson_order di
  get_lesson restano perché le legge l'app mobile, calcolate sul gate upstream.
- Il blocco del quiz è solo nella pagina della lezione (e nell'app tramite get_lesson): né la pagina
  diretta del quiz né submit_quiz lo controllano.
- Completamento (H-1): se l'upstream riscrive markProgress o trackVideoWatchDuration in Lesson.vue,
  rimettere l'ordine: prima i tempi di visione, poi save_progress con la lezione fissata. Il controllo
  ferma chi chiama l'API senza aprire la lezione, non chi apre la lezione e salta il video (correzione
  minima scelta il 2026-10-29).
- La patch v0_0_5 nasce da un problema generale: un campo validato aggiunto dall'upstream a un Single
  non riceve il default sui record esistenti e blocca ogni salvataggio delle impostazioni.
- Dopo un merge che tocca get_lesson verificare che il ramo os_lms sia ancora raggiungibile (vedi
  test_override_signatures), non solo presente."""
