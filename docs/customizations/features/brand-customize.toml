id = "brand-customize"
title = "Personalizzazione del marchio (Brand Customize)"
status = "active"
summary = """
Dal Desk l'amministratore adatta i colori della piattaforma al marchio del cliente senza toccare il
codice, in una di tre modalità: Base (quattro colori da cui si ricava tutto), Avanzata (un colore
per ogni ruolo: barra laterale, testi, pulsanti, bordi, grafici, tabelle...) o Esperto (qualsiasi
variabile CSS della piattaforma). Un'anteprima dal vivo mostra le pagine vere mentre si cambiano i
colori, con un controllo della leggibilità. I colori valgono per l'interfaccia, il Desk, la pagina
di accesso, i grafici e le tabelle; si possono salvare come preset, esportare e importare fra
istanze."""
why = """
Ogni istanza Elite ha il proprio cliente con la propria identità visiva; l'upstream permette solo
logo e nome. Il rifacimento del 2026-11 nasce dal report del cliente sulle variabili di colore:
alcune variabili condivise colorano insieme cose che il cliente vuole distinguere, e senza
anteprima ogni prova richiedeva un salvataggio (docs/brand-customize/PIANO.md)."""
roles = ["System Manager"]
behaviour = [
	"Brand Customize si modifica solo dal Desk e solo da System Manager; anche anteprima, preset e valori predefiniti rispondono solo a System Manager",
	"è attiva una sola modalità alla volta (Base, Avanzata o Esperto; Esperto per default): solo quella diventa CSS, i campi delle altre restano salvati ma ignorati; cambiando modalità il modulo propone di partire dai colori attuali",
	"in Base si scelgono colore principale, accento, sfondo e tinta dei grigi e il modulo mostra i colori dei ruoli che ne derivano; in Avanzata si sceglie un colore per ciascun ruolo (sfondi, barra laterale, testi, link, pulsanti, bordi, stati, 5 serie dei grafici, intestazione e righe delle tabelle) e il raggio degli angoli; Base e Avanzata accettano solo colori esadecimali",
	"in Esperto si scrive qualsiasi variabile CSS della piattaforma da una tabella con ricerca; il server accetta solo nomi presenti nell'elenco delle variabili della build e valori sicuri; una variabile salvata che la build non ha più resta, con un avviso, invece di bloccare il salvataggio; in ogni modalità il server rifiuta di salvare valori che potrebbero uscire dalla regola CSS e non li scrive mai nel foglio di stile",
	"i colori del marchio valgono solo nel tema chiaro: nel tema scuro e con l'alto contrasto restano i colori standard della piattaforma",
	"i colori della pagina di accesso (sfondo sfumato, testo, campi, pulsante) sono fuori dalle modalità e valgono sempre; lasciati vuoti, la pagina di accesso è quella standard; un'istanza senza nessun colore impostato produce un foglio di stile senza valori e la piattaforma resta com'è",
	"i colori si applicano alla SPA, al Desk e alle pagine web, caricati per ultimi così da prevalere sul tema statico; un salvataggio li aggiorna subito per tutti",
	"grafici e tabelle seguono le serie dei grafici e i colori di intestazione e righe delle tabelle solo se il marchio li imposta; altrimenti restano quelli standard",
	"l'anteprima carica le pagine principali della piattaforma (anche in vista telefono) con i valori non ancora salvati, evidenzia dove si vede il campo sotto il cursore, blocca clic e invii, e riporta il contrasto WCAG delle coppie testo/sfondo principali",
	"«Salva come preset» e «Applica preset» conservano e riapplicano un insieme di colori; «Esporta» e «Importa» spostano i colori fra istanze (file versione 2, che legge anche i file versione 1)",
	"i due colori dell'app mobile (App Main Color, App Secondary Color) si impostano qui e l'app li legge (scheda mobile-app-backend)",
]
