id = "web-pages-login"
title = "Pagine web di accesso, profilo e password"
status = "active"
summary = """
Le pagine che stanno fuori dalla SPA (accesso, registrazione, password dimenticata, accesso con
link via email, la pagina «Impostazioni» /me, la modifica del profilo e il cambio password)
hanno lo stile e i colori del cliente, i testi in italiano e i collegamenti per tornare alla
piattaforma. Le risposte di accesso con link e di recupero password sono uguali per ogni
indirizzo, così nessuno può scoprire chi è registrato."""
why = """
Le pagine web di Frappe hanno lo stile e i testi standard (molti restano in inglese, perché la
pagina per un ospite ha un dizionario di traduzioni ridotto) e il modulo di modifica del profilo non
mostra l'immagine né offre un modo per tornare indietro. Il cliente vuole un accesso coerente con
il proprio marchio (marzo-luglio 2026). Le risposte uguali per tutti chiudono i rilievi OWASP del
2026-10-26 e 2026-10-28."""
roles = ["Guest", "Student"]
behaviour = [
	"la pagina /login è servita dal template di os_lms (copia della pagina di Frappe) con il foglio di stile os_lms e i colori della pagina di accesso impostati in Brand Customize, caricati per ultimi",
	"la richiesta di accesso con link via email risponde allo stesso modo che l'indirizzo esista o no; il link arriva con il modello email di os_lms (modificabile dal Desk) ed è limitato ai tentativi orari impostati in System Settings (5 per default)",
	"la richiesta di nuova password risponde sempre «se l'indirizzo appartiene a un account attivo, abbiamo inviato le istruzioni», senza dire se l'account esiste, se è disabilitato né di chi è; per Administrator non parte nessuna email",
	"la pagina /me («Impostazioni») offre Modifica profilo, Reimposta password e «Vai alla Piattaforma» verso /lms",
	"il modulo di modifica del profilo (/update-profile) e la pagina di cambio password hanno un collegamento per tornare alle Impostazioni",
	"nel modulo di modifica del profilo la foto si vede sempre in anteprima, con i pulsanti Carica/Cambia e Rimuovi; l'etichetta è «Foto profilo» e l'avviso sui file pubblici è in italiano; la modifica si salva con il pulsante Salva del modulo",
]
