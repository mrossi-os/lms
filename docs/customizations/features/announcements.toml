notes = """
- L'editor ricco di frappe-ui (TipTap) non conserva l'HTML delle email: al primo tocco riscrive il
  corpo e perde stili in linea, pulsanti e tabelle. Per questo i tre rami; scelta confermata
  dall'utente, da non «semplificare».
- L'anteprima (AnnouncementContent.vue) è un iframe con sandbox senza allow-scripts, di proposito:
  l'avviso «Blocked script execution in about:srcdoc» è innocuo e non va «corretto» aggiungendo
  allow-scripts (XSS).
- L'endpoint richiede subject, batch, recipients e content: il modulo deve mandarli tutti.
- Dal merge di v2.62.0 il compositore è la pagina instradata upstream pages/Forms/AnnouncementForm.vue
  (non più una modale); il ricaricamento della lista segue il cambio di route. Il ramo dei modelli
  era già stato perso una volta in un merge (3caf07639) e ripristinato.
- La paginazione dipende dall'override di get_announcements: se sparisce, la risposta upstream è una
  lista e la scheda risulta vuota. L'override non seleziona name, quindi la chiave degli elementi è
  l'indice.
- Il badge dei non letti sulla scheda Annunci è nella scheda notifications."""
