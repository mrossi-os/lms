notes = """
- Due editor diversi, due percorsi diversi. Le lezioni usano EditorJS: il colore è un elemento nel
  testo del blocco, e il server lo toglieva al salvataggio perché sanitize_json passa ogni testo a
  sanitize_html con always_sanitize=True (nh3 scarta i tag sconosciuti); da qui l'allowlist server e
  l'ADD_TAGS di DOMPurify sul client. Descrizioni, annunci e quiz usano l'editor ProseMirror di
  frappe-ui, che salva var(--prose-color-*): il server lo conserva, il problema è solo di
  visualizzazione.
- Le variabili --prose-color-* / --prose-highlight-* esistono solo dentro .ProseMirror: ogni
  visualizzazione in sola lettura con v-html deve avere la classe ProseMirror sul contenitore (e la
  regola p:empty per le righe vuote), altrimenti il colore sparisce senza errori.
- Il nuovo editor (frappe-ui/editor) importa il suo style.css dentro editor/index.ts, ma il pacchetto
  dichiara sideEffects solo per css e vue e il build lo scarta: lo importiamo a mano in index.css. Dopo
  ogni aggiornamento di frappe-ui cercare prose-highlight-orange nel CSS generato in
  lms/public/frontend.
- Decisione del 2026-09-24 (v2.63.0): lo strumento colore è riscritto su ToolButton (non BaseInline,
  che scambierebbe gli span.lms-align per colori) ed emette <span class="lms-inline-color" style>;
  porta le tre protezioni della vecchia correzione (nodi catturati all'apertura del pannello,
  listener fissi sugli input colore, mousedown che non fa perdere la selezione). <lms-align> è stato
  tolto dall'allowlist: l'upstream emette span.lms-align.
- FontColor.vue è una copia dell'override frappe-ui con le sole stringhe tradotte: va tenuta allineata
  al file in node_modules dopo ogni aggiornamento di frappe-ui. Eccezione accettata (2026-09-24): il
  test upstream inkOnTintContrast segnala i 9 campioni bg-*-100, che restano.
- Nel composer degli annunci i colori si «cuociono» in esadecimale per anteprima ed email; la
  notifica tiene le variabili, risolte dalla card a tema."""
