{% set custom_signup_content = frappe.db.get_single_value("LMS Settings",
"custom_signup_content") %}
<style>
	/* Terms & conditions: scrollable notice + short acceptance checkbox */
	.signup-form .terms-and-conditions {
		text-align: left;
	}
	.signup-form .terms-and-conditions-content {
		max-height: 140px;
		overflow-y: auto;
		overflow-x: hidden;
		margin-bottom: 12px;
		padding: 10px 12px;
		border: 1px solid var(--border-color, #d1d8dd);
		border-radius: var(--border-radius, 6px);
		background-color: var(--gray-50, #f7f7f7);
		font-size: var(--text-sm, 12px);
		line-height: 1.5;
		color: var(--text-muted, #6c757d);
	}
	.signup-form .terms-and-conditions-content h1 {
		font-size: 2.5rem;
	}
	.signup-form .terms-and-conditions-content p:last-child {
		margin-bottom: 0;
	}
	.signup-form .terms-and-conditions-check {
		display: flex;
		align-items: flex-start;
		gap: 8px;
		margin: 0;
		font-size: var(--text-sm, 12px);
		color: var(--text-color, #1f272e);
		cursor: pointer;
	}
	.signup-form .terms-and-conditions-check input[type="checkbox"] {
		margin-top: 2px;
		flex-shrink: 0;
	}
</style>
<form class="signup-form" role="form">
	<div class="page-card-body">
		<div class="form-group">
			<label class="form-label sr-only" for="signup_fullname">
				{{ _("Full Name") }}
			</label>
			<input
				type="text"
				id="signup_fullname"
				class="form-control"
				placeholder="{{ _('Jane Doe') }}"
				required
				autofocus
			/>
		</div>
		<div class="form-group">
			<label class="form-label sr-only" for="signup_email">
				{{ _("Email") }}
			</label>
			<input
				type="email"
				id="signup_email"
				class="form-control"
				placeholder="{{ _('jane@example.com') }}"
				required
			/>
		</div>

		{% if custom_signup_content %}
		<div class="form-group terms-and-conditions">
			<label class="terms-and-conditions-check" for="signup-terms">
				<input
					type="checkbox"
					autocomplete="off"
					class="input-with-feedback"
					data-fieldtype="Check"
					data-fieldname="terms"
					id="signup-terms"
					name="signup-terms"
					required
				/>
				<span style="color: black"
					>{{ _("I agree to the Terms and Conditions") }}</span
				>
			</label>
			<div class="terms-and-conditions-content">
				{{ custom_signup_content }}
			</div>
		</div>
		{% endif %}
	</div>
	<div class="page-card-actions">
		<button
			class="btn btn-sm btn-primary btn-block btn-signup"
			type="submit"
		>
			{{ _("Sign up") }}
		</button>

		<p class="text-center sign-up-message">
			<a href="#login" class="blue">{{ _("Have an account? Login") }}</a>
		</p>
	</div>
</form>

<script>
	frappe.ready(function () {
		$(".signup-form").on("submit", (e) => {
			signup(e);
		});
	});

	const signup = (e) => {
		e.preventDefault();
		const email = ($("#signup_email").val() || "").trim();
		const full_name = frappe.utils.xss_sanitise(
			($("#signup_fullname").val() || "").trim(),
		);

		if (!email || !validate_email(email) || !full_name) {
			login.set_status('{{ _("Valid email and name required") }}', "red");
			return false;
		}

		frappe.call({
			method: "lms.lms.user.sign_up",
			args: {
				email: email,
				full_name: full_name,
				verify_terms: $("#signup-terms").prop("checked") ? 1 : 0,
				user_category: "",
			},
			statusCode: login.login_handlers,
		});
		return false;
	};
</script>
