[[entries]]
id = "permissions-valutatore-lesson-access"
title = "Il Valutatore legge le lezioni dei corsi delle sue classi"
layer = "spa-graft"
confidence = "high"
intent = """
Un Valutatore rivede i corsi delle classi che valuta: può leggere ogni lezione e i suoi
materiali per studenti come uno studente iscritto, senza iscrizione (quindi senza tracciamento
dei progressi) (commit b6b075222). I materiali riservati agli istruttori restano esclusi: il
ramo sta di proposito dopo il controllo instructor_only. ATTENZIONE al merge di v2.59.0:
l'upstream riscrive can_access_lesson in resolve_lesson_access, che restituisce la coppia
(is_instructor, can_access); il ramo del valutatore va rimesso lì come `return False, True`
dopo il controllo can_modify_course, così instructor_only continua a escluderlo. L'upstream
aggiunge anche can_access_quiz: valutare se il valutatore debba leggere anche i quiz."""

  [[entries.sites]]
  file = "lms/lms/permissions.py"
  anchor = "if is_course_valutatore(lesson_row.course, user):"
  symbol = "can_access_lesson"

