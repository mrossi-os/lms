title = "Ricerca per parole nelle liste"
status = "active"
summary = """
Nelle caselle di ricerca delle liste di corsi, classi, programmi, quiz, compiti ed esercizi di
programmazione si possono scrivere più parole: ogni parola aggiunta restringe i risultati invece di
azzerarli. La lista segue subito quello che si scrive e svuotare la casella toglie il filtro."""
why = """
L'upstream cercava l'intera frase come un unico blocco contiguo: aggiungere una seconda parola, anche
una sola lettera, svuotava la lista. In più alcune liste ricaricavano sull'evento sbagliato ed erano
sempre indietro di un carattere, e dopo «Carica altri» una nuova ricerca faceva sparire righe."""
