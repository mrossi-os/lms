id = "guided-learning-path"
title = "Percorso guidato: ordine delle lezioni e obbligo di visione"
status = "active"
summary = """
Chi prepara un corso può imporre un percorso: le lezioni si aprono in ordine, il quiz si sblocca
solo dopo aver completato le lezioni che lo precedono, e una lezione conta come completata solo se
lo studente l'ha davvero aperta e, quando è richiesto, ne ha guardato il video. Le regole valgono per
gli studenti iscritti; chi gestisce il corso le attraversa liberamente."""
why = """
Il cliente fa formazione e deve poter dimostrare che lo studente ha seguito i contenuti in ordine,
senza saltare quiz o video. L'upstream non aveva un blocco sequenziale fino a v2.62.0 e non ha
tuttora il blocco del quiz a completamento; inoltre completava una lezione su semplice chiamata API,
senza che fosse mai stata aperta (audit OWASP H-1, 2026-10-29), e accettava i dettagli SCORM
inviati dal browser su qualunque lezione (audit del 2026-10-28)."""
roles = ["Student", "Moderator", "Course Creator", "Docente", "Valutatore"]
behaviour = [
	"con «Enforce Quiz on Completion» attivo nelle impostazioni del corso, lo studente iscritto che apre la lezione con il quiz prima di aver completato tutte le lezioni precedenti vede, al posto del quiz, la schermata «Quiz bloccato» con il motivo «Completa tutte le lezioni precedenti prima di accedere al quiz.»",
	"il blocco del quiz vale sia per il quiz inserito come blocco nel contenuto della lezione sia per il quiz collegato alla lezione nel vecchio formato",
	"l'ordine delle lezioni è quello dell'upstream (interruttore «Enforce Lesson Completion» del corso); un corso che aveva acceso il vecchio interruttore os_lms «Enforce Lesson Order» lo ritrova acceso dopo l'aggiornamento",
	"moderatori, Course Creator, istruttori del corso e il Valutatore di una classe che contiene il corso non sono mai bloccati né dall'ordine delle lezioni né dal quiz",
	"l'app mobile riceve con la lezione gli stessi esiti (lezione accessibile, quiz accessibile, ordine imposto); a chi è esente il pulsante «avanti» non resta disattivato",
	"il server completa una lezione solo se l'ha consegnata allo stesso utente negli ultimi 7 giorni (pagina della lezione o player SCORM); altrimenti rifiuta con «Apri la lezione prima di segnarla come completata.»",
	"con l'obbligo di visione del video attivo nelle impostazioni, una lezione con un video YouTube, Vimeo o caricato si completa solo dopo che la pagina ha registrato un tempo di visione per quella lezione; altrimenti il server rifiuta con «Guarda il video della lezione prima di segnarla come completata.»",
	"i dettagli SCORM inviati dal browser contano solo sulle lezioni di un capitolo SCORM: su una lezione normale il completamento passa dai controlli consueti, quiz e compiti compresi",
	"le regole di completamento valgono solo per chi è iscritto al corso: per lo staff che guarda una lezione non si registra nulla, come nell'upstream",
	"un errore non fatale del player (per esempio Vimeo che rifiuta la lettura dei metadati di un video non in elenco) non disattiva l'obbligo di vedere il video: il ripiego sul timer di permanenza scatta solo se il player non è mai diventato pronto, oppure dopo 15 secondi senza avvio",
	"a fine video il tempo di visione viene scritto una sola volta",
	"su un sito con il tempo di permanenza della lezione a 0 o vuoto, l'aggiornamento lo porta a 30 secondi, così le impostazioni tornano a salvarsi",
]
