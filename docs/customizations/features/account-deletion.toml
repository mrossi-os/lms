notes = """
- La prova di accettazione è find_traces(email, user) in account_deletion.py: cerca l'email e il
  nome utente in ogni colonna di testo del database. I test la usano dopo la cancellazione di uno
  studente e di un docente; usarla anche dalla console dopo una cancellazione reale.
- La risposta a una password sbagliata è una ValidationError di proposito: una AuthenticationError
  fa rispondere Frappe con 401 e cancellare i cookie, cioè un refuso disconnetterebbe l'utente.
- erase_user va in coda dopo il logout, che fa commit: accodato prima, girava in anticipo e lasciava
  indietro l'Activity Log «Force Logged out». La funzione si può rilanciare su un utente già
  cancellato (ripulisce solo ciò che resta).
- Ogni nuovo doctype che conserva l'email di un utente in un campo di testo (non un Link a User)
  va aggiunto a LOG_RECORDS o OWNED_RECORDS, altrimenti find_traces lo trova dopo la cancellazione.
  Ogni nuovo Link a User in cui l'utente ha solo «agito» su un record altrui va in ROLE_LINK_FIELDS
  di events/user.py, altrimenti la cascata cancella dati di altre persone.
- Innesti nei file upstream (voci collegate): Profile.vue e MobileYou.vue (pulsante e riga), App.vue
  e Members.vue, lms/templates/signup-form.html. Se l'upstream rinomina la chiave «Log out» della riga
  di uscita, withDeleteAccountRow non inserisce più la riga su telefono.
- La voce account-deletion-review-and-privacy-consent è condivisa con la scheda signup-privacy, che
  descrive la casella privacy e la finestra di accettazione.
- La pagina web /me di Frappe (scheda web-pages-login) mostra ancora, se Website Settings la abilita,
  la voce «Delete Account» verso la richiesta standard di Frappe, che pseudonimizza."""
