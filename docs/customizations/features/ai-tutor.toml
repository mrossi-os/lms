id = "ai-tutor"
title = "Tutor AI"
status = "active"
summary = """
Nelle pagine di un corso compare un pulsante flottante che apre il tutor AI: un assistente che
risponde alle domande dello studente usando il contenuto del corso, della lezione aperta e degli
allegati dei badge del corso. Si può scrivere o dettare a voce, e la risposta può essere letta ad
alta voce. Ogni domanda viene registrata con la risposta e il contesto usato, a disposizione di
amministratori e docenti del corso."""
why = """
Funzionalità richiesta dal cliente per dare allo studente un aiuto continuo sul materiale del
corso; l'upstream non ha alcun assistente AI. Il registro delle domande serve a vedere dove gli
studenti si bloccano e a rendicontare l'uso dell'AI (politica AI e certificazione ESG)."""
roles = ["Student", "Docente", "Course Creator", "Moderator", "Gestore", "System Manager"]
behaviour = [
	"il pulsante del tutor compare in basso a destra su ogni pagina che ha un corso nell'indirizzo, su desktop e telefono, solo con l'interruttore AI acceso (Impostazioni > AI > Rag Tutor > Enabled); su telefono sale sopra la barra fissa «Continua» del corso",
	"il tutor conosce il corso della pagina e, nella pagina della lezione e nell'editor della lezione, anche la lezione aperta; uscendo dalle pagine del corso il contesto si azzera",
	"il server risponde solo a chi può leggere il corso e, se la domanda riguarda una lezione, a chi può leggere quella lezione nello stato in cui è adesso",
	"per uno studente il tutor usa solo le lezioni che ha già completato, più la lezione aperta e i file allegati ai badge del corso; per chi è istruttore del corso o moderatore usa tutte le lezioni del corso",
	"quando usa un allegato dei badge, il tutor dice allo studente il nome del file e che fa parte degli allegati del corso",
	"ogni utente può fare al massimo 60 domande all'ora (testo e voce insieme); una domanda oltre 4000 caratteri è rifiutata e della conversazione precedente il server considera solo gli ultimi 20 messaggi",
	"la dettatura a voce funziona solo con «Abilita dettatura vocale» acceso e la lettura della risposta solo con «Abilita lettura vocale dei messaggi» acceso, controllati dal server; un errore della lettura vocale lascia comunque la risposta scritta; con l'opzione relativa la risposta a una domanda dettata parte da sola",
	"ogni domanda, anche fallita, viene registrata con risposta, contesto usato, corso, lezione e studente; un errore di registrazione non blocca la risposta",
	"il registro delle domande lo leggono e gestiscono per intero System Manager e Moderator (quindi i Gestore); un Course Creator lo legge in sola lettura solo per i corsi di cui è istruttore; gli studenti non hanno alcun permesso",
	"la lingua delle risposte e il comportamento del tutor seguono il prompt «Tutor AI» modificabile dal pannello Prompt AI (scheda ai-platform)",
]
