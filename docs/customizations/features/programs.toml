notes = """
- I corsi non pubblicati dei membri passano da is_course_in_member_program (lms/lms/utils.py) in
  get_course_details, nella validazione dell'iscrizione di LMS Enrollment (import locale, circolare)
  e, da v2.64.0, in can_view_course e can_access_course; la guardia di CourseDetail.vue legge il flag
  in_member_program. Se sparisce una guardia server lo studente non vede il corso o non si iscrive;
  se sparisce quella della pagina viene rimandato all'elenco corsi. Domanda aperta: il dialogo di
  iscrizione per i non membri non elenca i corsi non pubblicati.
- La descrizione va salvata con sanitizeRichHTML, non con sanitizeHTML (la lista chiusa toglie
  span, mark, s e style); in lettura passa da CourseDescription.vue (scheda course-page-redesign) con
  hasRichContent.
- Immagini nelle descrizioni: gli editor di frappe-ui caricano privato per default e Frappe aggancia
  al documento solo i campi Attach, quindi il file resta privato e orfano e solo chi l'ha caricato lo
  vede (403 per tutti gli altri, Elite «PROGRAMMA 2», 2026-09-28). Dopo ogni merge controllare la prop
  uploadArgs nei due file upstream CourseOverviewSection.vue e NewCourseForm.vue. Ogni nuovo editor il
  cui contenuto è letto da altri ha bisogno della stessa scelta. L'editor della descrizione della
  classe non è stato cambiato. La patch non sposta l'originale privato (il passaggio
  privato→pubblico di Frappe sposta il file su disco).
- Il modulo lavora sul documento completo (frappe.client.get e PUT su /api/resource) invece delle
  list resource upstream sui figli, che lasciavano gli elenchi vuoti; il motivo esatto del PUT non è
  scritto. Il dialogo «Aggiungi corso» era stato rotto da un refactor (3255d0a07): serve solo i corsi.
- Il MultiSelect upstream (components/Controls/MultiSelect.vue) ha due innesti nostri, la prop exclude
  e l'esposizione di cachedOptions: senza, il dialogo riproporrebbe i corsi già presenti.
- Programmi gestiti in comune: l'upstream (v2.64.0, #2787) restringe la scrittura agli autori del
  programma; il nostro ramo restituisce sempre True per i ruoli di authoring. Il Gestore ci arriva
  tramite Moderator."""
