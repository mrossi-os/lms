id = "members-and-roles"
title = "Membri e assegnazione dei ruoli custom"
status = "active"
summary = """
Riguarda come si creano i membri della piattaforma e come si assegnano i ruoli personalizzati
Gestore, Docente e Valutatore: dove compaiono gli interruttori, chi ha il diritto di usarli, come
nasce un nuovo membro con i soli ruoli scelti e quale traccia resta di ogni concessione. Include la
vista studente che spegne anche questi ruoli e l'esportazione dei ruoli con i loro permessi dal Desk."""
why = """
L'LMS standard gestisce solo i suoi quattro ruoli (LMS Student, Course Creator, Batch Evaluator,
Moderator) e aggiunge LMS Student a ogni nuovo utente. Il cliente ha tre ruoli in più e vuole che
siano assegnabili dalla SPA, che un valutatore non diventi studente per errore e che solo persone
autorizzate concedano i ruoli più potenti (regola del cliente del 2026-10-23, OWASP H-2: prima ogni
Moderator poteva farsi Gestore)."""
roles = ["Moderator", "Gestore", "Docente", "Valutatore", "System Manager"]
behaviour = [
	"nella scheda Ruoli del profilo, visibile ai moderatori, ci sono anche gli interruttori Valutatore, Manager (= Gestore) e Teacher (= Docente)",
	"solo l'account Administrator assegna o toglie il ruolo Gestore; Docente e Valutatore li assegnano anche i Gestori; un Moderator senza Gestore che ci prova riceve un errore di permesso dal server",
	"Impostazioni → Membri mostra un badge anche per il ruolo Valutatore; un ruolo sconosciuto mostra il proprio nome e le etichette dei ruoli sono tradotte",
	"in Impostazioni → Membri il clic sulla riga di un membro apre la sua modifica (nome e ruoli, compreso Valutatore); il clic su avatar e nome apre il profilo",
	"un nuovo membro, creato da Impostazioni → Membri o dai campi Istruttori di corso e classe, ha esattamente i ruoli scelti: nessun LMS Student aggiunto in automatico",
	"senza almeno un ruolo scelto la creazione del membro è rifiutata («Select at least one role»)",
	"solo un Moderator crea membri; un Moderator che non può assegnare Gestore riesce comunque ad aggiungere un membro senza ruoli custom",
	"ogni concessione o revoca di Gestore, Docente e Valutatore, anche quella automatica dalla classe, scrive una riga nell'Activity Log sulla timeline dell'utente: chi l'ha fatta, a chi, quale ruolo, quando",
	"in vista studente (anteprima della lezione) anche i flag e i ruoli Docente, Valutatore e Gestore risultano spenti, quindi spariscono le loro funzioni, per esempio il pannello di correzione dei compiti",
	"nel Desk la scheda di un Ruolo ha «Export with Permissions», che scarica un JSON con il ruolo e la sua matrice di permessi, e l'elenco dei Ruoli ha «Import with Permissions», che li ricrea senza toccare i permessi degli altri ruoli; entrambe riservate al System Manager",
]
