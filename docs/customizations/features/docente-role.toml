id = "docente-role"
title = "Ruolo Docente (istruttore globale)"
status = "active"
summary = """
Il Docente è un ruolo personalizzato del cliente: un istruttore che vale su tutta la
piattaforma. Apre ogni corso e ogni classe, anche dove non è indicato come istruttore,
gestisce le classi e le loro lezioni dal vivo, corregge e modifica prove e contenuti
creati da altri e assegna istruttori e valutatori. Non è un amministratore: niente
impostazioni generali, import, né Desk."""
why = """
L'LMS standard conosce il Moderator (tutto, compresa l'amministrazione) e il Course Creator /
istruttore (solo i corsi e le classi in cui compare). Il cliente voleva una figura di docente
che lavori su tutti i corsi e le classi senza i poteri di amministrazione del Moderator
(decisione 2026-06; «Docente globale ovunque» confermata ai merge di v2.64.0 e v2.65.0 e
nella matrice dei ruoli del cliente del 2026-10-05). L'upstream aggiunge a ogni release nuovi
controlli che conoscono solo Moderator e istruttori: senza innesti il Docente li perde uno a uno."""
roles = ["Docente", "Moderator", "Course Creator", "Batch Evaluator"]
behaviour = [
	"il Docente vede la card di ogni corso da amministratore: nessun invito a iscriversi, compaiono le azioni di gestione",
	"il Docente apre ogni corso, anche non pubblicato o in arrivo, senza essere rimandato all'elenco dei corsi, e nella lezione ha i controlli di gestione come un istruttore",
	"su un corso di cui non è istruttore il Docente lo visiona soltanto: non vede le schede Dashboard, Editor lezioni, Impostazioni e Simulazioni, e il modulo impostazioni del corso lo rimanda all'elenco dei corsi",
	"nella pagina di ogni classe il Docente è amministratore: vede Dashboard amministrativa e Impostazioni, pubblica, importa e iscrive studenti, invia annunci, genera certificati in blocco e modifica i modelli email della classe",
	"il Docente vede «Crea classe» nell'elenco delle classi e trova negli elenchi anche le classi non pubblicate",
	"il Docente crea, modifica ed elimina le lezioni dal vivo di qualunque classe, e il server accetta le stesse operazioni",
	"il Docente apre, modifica e corregge quiz, compiti, esercizi e le loro consegne anche nei corsi dove non è istruttore, e vede corsi e contenuti in bozza nelle liste e nei selettori",
	"il Docente iscrive studenti e legge le iscrizioni di qualunque classe",
	"il Docente vede progressi e statistiche video anche dei corsi dove non è istruttore",
	"i file caricati da un Docente nelle lezioni si aprono per gli studenti iscritti (niente 403), anche se il Docente non è istruttore del corso",
	"un capitolo SCORM, la risposta modello di un compito e le spiegazioni di una domanda salvati da un Docente conservano questi campi (permlevel 1 concesso dove il Docente ha già il livello 0)",
	"il Docente cerca gli utenti nei campi Istruttori di corsi e classi e Valutatori delle classi senza ricevere 403; per gli altri ruoli quelle ricerche restano come nell'upstream",
