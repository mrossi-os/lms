	"il piede della barra laterale mostra il numero di versione dell'app (per esempio 1.16.66)",
	"la scheda Barra laterale delle impostazioni ha cinque interruttori in più, Home, Programmi, Cerca, Quiz e Compiti, accesi per default: spegnerne uno nasconde la voce corrispondente",
