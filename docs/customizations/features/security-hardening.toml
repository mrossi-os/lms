notes = """
- Il plugin os-inert-paste-html va registrato in DUE configurazioni: vite.config.js (la build che
  arriva agli utenti) e vitest.config.ts (i test). Se un merge lo toglie solo da vite.config.js i
  test restano verdi ma il sito torna vulnerabile. Se la build fallisce con «expected N ×
  document.createElement('div')», frappe-ui ha cambiato i gestori di incolla: ricontrollarli e
  aggiornare RULES, mai togliere il plugin.
- Versioni minime: un conflitto su frontend/package.json risolto prendendo il lato upstream
  riporterebbe versioni vulnerabili. Le soglie si alzano, non si abbassano mai; le ancore
  dell'inventario stanno sui nomi dei pacchetti, la versione la sorveglia test_dependency_floors.
- I timeout sulle chiamate esterne sono innesti in lms/lms/utils.py, lms/unsplash.py,
  lms_batch.py e lms_live_class.py: un merge che riscrive quelle funzioni li fa sparire senza
  errori (voce external-calls-timeout). ip-api.com resta in HTTP perché la versione gratuita non
  ha HTTPS.
- Le correzioni OWASP legate a una funzione stanno nelle schede di quella funzione (registrazione e
  password in signup-privacy e web-pages-login, ruoli in members-and-roles, completamento delle
  lezioni, consegne valutate, discussioni, simulazioni, Elite API, TrueSkills); i test test_owasp_*
  sono raccolti qui perché coprono più funzioni insieme.
- Ogni correzione di sicurezza va provata su staging (elite.overside.it) prima della pubblicazione
  (piano ESG); il deploy di staging tende a segnare le patch come eseguite senza lanciarle.
- Il rapporto OWASP e il piano residuo citati nei commit (docs/security/owasp-*.md) non sono in
  questo branch."""
