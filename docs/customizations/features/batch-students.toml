notes = """
- Iscrizioni ai corsi in after_insert: LMS Enrollment concede l'accesso a un membro della classe
  cercando nel database proprio la LMS Batch Enrollment (bypass enrollment_from_batch), quindi le
  iscrizioni ai corsi vanno create quando il record esiste già. Il salvataggio è con
  ignore_permissions perché le crea il sistema. Correzione in più file (a7cd6d837): anche
  lms_enrollment.py mette il bypass di classe prima dei controlli di autoiscrizione.
- ignore_permissions chiude anche un problema visto in produzione (2026-06-23/24): l'iscrizione a
  cascata ai corsi falliva con «You need the 'create' permission on Iscrizione LMS» (Iscrizione LMS =
  LMS Enrollment) per DocPerm personalizzate e per un hook has_permission che restituiva None, che
  nella Frappe attuale vale come rifiuto.
- patches.txt contiene solo voci, senza marcatore: se la nostra riga sparisce in un merge, i siti non
  ancora migrati non recuperano le iscrizioni. Al merge di v2.61.0 l'upstream ha accodato la sua
  patch nello stesso punto: tenere entrambe le righe.
- Al merge di v2.62.0 l'upstream ha sostituito la finestra con il modulo instradato BatchStudentForm
  (un solo utente, campo Pagamento, gate senza Docente): riapplicati selezione multipla, ciclo con
  messaggio aggregato, niente Pagamento e Docente ammesso. frontend/src/tests/batchStudentForm.test.ts
  è dell'upstream. Il controllo vero è validate_owner sul server, che ammette il Docente tramite
  can_author_batch.
- La rimozione dalla classe ha regole diverse da quella dal corso (scheda course-dashboard): il
  committente ha scelto di non cambiarle. La rimozione cancella solo l'iscrizione alla classe.
- Il pulsante Importa vive nell'intestazione della classe (scheda batch-detail-page) e chiama
  goToImport esposto dalla dashboard: se sparisce da defineExpose il pulsante non fa nulla."""
