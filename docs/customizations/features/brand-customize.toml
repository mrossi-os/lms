notes = """
- Il CSS del marchio va caricato per ULTIMO: in sviluppo Vite inietta il CSS importato dopo i <link>
  statici, per questo main.js aggiunge il link a runtime. Il Desk carica desk.css dopo brand_css.
- Il selettore dei colori del marchio è :root:not([data-theme="dark"]):not([data-contrast="more"])
  (BRANDED_THEME_SELECTOR); os_lms.css fa lo stesso per la palette aziendale. Regola dell'utente
  del 2026-10-23: i colori del cliente valgono solo nel tema chiaro; scuro e alto contrasto usano la
  palette standard.
- I token di frappe-ui (--surface-*, --ink-*, --outline-*) sono canali RGB separati da spazi, non
  colori: in CSS semplice vanno usati come rgb(var(--token)). L'elenco delle variabili per la
  modalità Esperto viene dalla build della SPA (senza build non c'è elenco da controllare).
- Grafici: gli override di AxisChart e DonutChart avvolgono l'originale (alias frappe-ui-*-original)
  e passano i colori solo se il marchio li imposta. A ogni aggiornamento di frappe-ui verificare che
  i due componenti esistano e accettino ancora config.colors (brandAnchors.test.ts).
- Deploy: le patch v0_0_10 e v0_0_11 sono state verificate a mano su staging (2026-11-09), perché il
  deploy di staging tendeva a segnarle eseguite senza lanciarle. Prova fra ambienti fatta: esporta
  in locale, importa su staging e viceversa, con brand.css identico byte per byte. Il lavoro sul
  marchio non si pubblica senza chiedere all'utente; script di prova
  docs/brand-customize/test-import-export.js.
- Il tema imposto dall'amministratore (campo theme) non esiste più: dal 2026-10-23 l'utente sceglie
  chiaro o scuro (scheda theme-contrast)."""
