  anchor = "v-if=\"hasCardContent\""

  [[entries.sites]]
  file = "frontend/src/components/CourseCardOverlay.vue"
  anchor = "const certLinksVisible = computed<boolean>"

[[entries]]
id = "course-tablet-inline-card"
title = "Card corso completa in linea sul tablet"
layer = "override-file"
confidence = "high"
intent = """
Tra 640 e 1023px la pagina è a colonna singola ma la card laterale desktop (lg:) è
nascosta: lì si rende in linea la card completa originale, così il trattamento mobile
(barra fissa + programma in fondo) resta confinato al telefono."""

