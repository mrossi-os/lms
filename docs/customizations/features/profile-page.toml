id = "profile-page"
title = "Profilo utente"
status = "active"
summary = """
Il profilo è ridotto all'essenziale: lo studente vede solo i suoi certificati, senza copertina né
schede in più, e nella modifica del profilo trova solo immagine, nome, cognome e codice fiscale. Il
codice fiscale serve all'emissione dei badge TrueSkill e viene controllato nel formato. Un profilo che
non si può aprire mostra un messaggio chiaro invece di una pagina bianca."""
why = """
Il cliente non usa le informazioni personali del profilo né il flusso upstream di prenotazione delle
valutazioni con le disponibilità del valutatore, e vuole un profilo semplice. Il codice fiscale è
obbligatorio per i certificati TrueSkill (fiscalId) e deve essere inserito dallo studente stesso.
Decisione del 2026-11-23: il codice fiscale sta in questa scheda; la scheda TrueSkill lo cita."""
roles = ["Student", "Moderator", "Course Creator", "Batch Evaluator", "Docente", "Valutatore"]
behaviour = [
	"il profilo si apre sulla scheda Certificati; le schede Informazioni, Disponibilità e Calendario valutazioni non compaiono (le loro rotte esistono ancora)",
	"allo studente la barra delle schede non viene mostrata; agli altri ruoli compare con Certificati e, per il Moderator, Ruoli",
	"il profilo non ha l'immagine di copertina né il pulsante per cambiarla: resta uno spazio vuoto sopra l'avatar",
	"un utente vede sempre il proprio profilo, anche senza un ruolo LMS; per il profilo di altri serve un ruolo LMS (regola oggi anche dell'upstream)",
	"il profilo di un utente inesistente mostra la pagina Non trovato; ogni altro errore di caricamento, in particolare il profilo altrui senza ruolo LMS, mostra la pagina Permesso negato",
	"la modifica del profilo è a una colonna con immagine, nome, cognome e codice fiscale; titolo, LinkedIn, GitHub, Twitter, «disponibile per», lingua e bio non compaiono, quindi la lingua non si cambia dal profilo",
	"l'immagine del profilo è facoltativa: il profilo si salva anche senza (regola oggi anche dell'upstream)",
	"il codice fiscale si salva in maiuscolo e senza spazi ai lati, può restare vuoto e deve avere il formato italiano di 16 caratteri: un formato errato mostra un errore e non salva nulla",
	"due utenti non possono avere lo stesso codice fiscale",
	"il codice fiscale si legge solo dal proprio record e non compare nei dati del profilo mostrati agli altri",
	"nella pagina Disponibilità del valutatore, ancora raggiungibile dall'indirizzo, aggiungere una fascia senza giorno o orari dà un avviso; il calendario delle valutazioni ha il titolo «Valutazioni prenotate» e un testo quando è vuoto",
]
