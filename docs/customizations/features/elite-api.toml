id = "elite-api"
title = "Elite API (lettura per sistemi esterni)"
status = "active"
summary = """
Un'API in sola lettura con cui sistemi esterni (il primo è TrueSkill) leggono corsi, classi e
studenti iscritti con nome, cognome, codice fiscale, email e avanzamento. L'accesso avviene con
chiavi create e revocate da amministratori e Gestore in una scheda delle impostazioni; ogni chiamata
viene registrata. La guida per chi integra è docs/elite-api/guida-integrazione.md."""
why = """
TrueSkill deve sapere chi ha completato quali corsi per emettere certificati in blocco. Le chiavi
native di Frappe sono una coppia per utente e aprirebbero ogni endpoint autenticato; i Gestore, che
devono gestire le chiavi, sono in gran parte Website User senza Desk. Decisioni D1-D13 prese con
l'utente il 2026-09-30."""
roles = ["System Manager", "Gestore"]
behaviour = [
	"la scheda «Elite API» delle impostazioni, e la creazione, l'elenco e la revoca delle chiavi, sono solo per System Manager (Administrator) e Gestore, controllate anche dal server; ognuno di loro vede e revoca tutte le chiavi",
	"la chiave completa si vede una sola volta alla creazione; può avere una data di scadenza (valida tutto quel giorno); una chiave revocata o scaduta non si riattiva e non si modifica; più chiavi possono essere attive insieme, tutte con lo stesso ambito",
	"le chiamate vanno solo in GET sugli endpoint v1 (ping, list_courses, list_batches, get_course_students, get_batch_students) con l'header X-Elite-Api-Key; senza header o con un altro metodo la risposta è 403",
	"una chiave inviata insieme all'header Authorization, a una sessione di login o al parametro cmd è rifiutata con 400 invalid_request; chiave errata, revocata o scaduta danno tutte lo stesso 401 invalid_api_key",
	"oltre 20 tentativi con chiave non valida dallo stesso indirizzo in 10 minuti danno 429; una chiave valida non viene mai bloccata e non c'è limite di chiamate per chiave",
	"i corsi elencati comprendono anche quelli non pubblicati e dicono se il corso emette già il badge TrueSkill; la ricerca guarda il titolo, non l'identificativo",
	"gli studenti restituiti sono solo gli iscritti come studenti con account attivo, una volta per corso, ordinati per cognome, nome ed email; il codice fiscale è in maiuscolo senza spazi oppure null, senza controllo di formato",
	"lo stato di avanzamento: corso completato a 100, in corso fra 0 e 100, non iniziato a 0; per la classe contano solo i corsi (non le valutazioni), quindi può differire dalla dashboard della classe",
	"le liste sono paginate (page fino a 100.000, page_length da 1 a 500, predefinito 100); un corso o una classe inesistenti danno 404 not_found, un parametro non valido 400 invalid_parameter",
	"ogni chiamata viene registrata con chiave, endpoint, parametri, righe restituite, durata e indirizzo, mai i dati degli studenti; il registro si cancella dopo 90 giorni",
	"le richieste girano come un utente tecnico disattivato con il solo ruolo «Elite API Client»; se quell'utente ha ruoli in più la chiave è rifiutata con 403 e un Error Log",
]
areas = [
