notes = """
- Un link vimeo.com/share/<uuid> non si può incorporare in nessun modo: il codice non contiene l'id,
  la pagina non reindirizza, l'oEmbed di Vimeo dà 404 e la pagina vieta l'iframe. L'id si ricava solo
  leggendo la pagina lato server (resolve_vimeo_share ricostruisce l'URL dal codice, contro lo SSRF).
- Invariante: un blocco di lezione risolto si salva con service «vimeo», source vimeo.com/<id>/<hash>
  ed embed player.vimeo.com/video/<id>?h=<hash>; il servizio vimeoShare non deve mai essere salvato,
  perché il backend legge source per l'audio HLS e il trascrittore AI legge embed.
- Il campo di anteprima non risolve il link nel validate del server di proposito: il modulo del corso
  si salva da solo e un disservizio di Vimeo bloccherebbe salvataggi che non c'entrano.
- Entrambe le metà frontend sono innesti in file upstream (utils/index.js, VideoPreviewField.vue): da
  riapplicare dopo ogni merge. getVideoEmbedURL vive in utils/video.ts ed è riesportata da
  utils/index.js per l'hero del corso (CourseHero.vue): se la riesportazione sparisce il banner non
  compila.
- La lacuna «nessuna anteprima per i link Vimeo nel campo» segnata il 2026-07-15 è chiusa dal
  2026-09-07 (0a61c2f10): getVideoPreview classifica un link Vimeo come embed.
- validate_video_link (lms_course.py): dalla v2.57.0 l'upstream salva il link così com'è e il frontend
  accetta URL e id; la nostra versione potrebbe essere superflua, ma il committente l'ha confermata il
  2026-09-25 (B6.4).
- Vimeo Settings serve oggi solo a get_lesson_audio_stream (audio delle lezioni Vimeo per l'app).
- Nella suite dei test di questa scheda alcune failure erano già presenti alla creazione: mock
  esplicito di frappe-ui, matchMedia stubbato prima di importare Plyr, __ nei mocks globali."""
