  merge di v2.63.0, per decisione del committente.
- v2.63.0 ha ridisegnato player e authoring dei quiz (banca domande, proctoring): sono stati
  riapplicati pulsanti affiancati, isBlankAnswer, conferma in entrambe le modalità e timer a
  orologio; l'avviso sugli errori di consegna e il conteggio delle saltate nella conferma sono ora
  dell'upstream. Molte voci di stile sono tollerate (aspetto upstream adottato): modulo del quiz,
  tipi di domanda, stile dei radio del vecchio modale, lista delle consegne, colonne su telefono,
  cache della risorsa del quiz.
- Le liste dei quiz e delle consegne passano dal ListPage upstream, che disegna da sé la tabella:
  l'aspetto upstream era «DA VERIFICARE nell'app» dal 2026-09-23.
- Radio: @tailwindcss/forms usa appearance:none, quindi accent-color non ha effetto; il colore si
  governa con color/currentColor e il puntino del plugin è bianco. Le regole del plugin usano :where()
  (specificità 0) e riaffermano lo sfondo in :hover/:focus, da cui le varianti.
- Il permesso dello studente sulle consegne: le righe Custom DocPerm già presenti su un sito
  sostituiscono interamente i permessi del JSON, per questo serve la patch v0_0_8.
- I test quiz dell'upstream sul database di sviluppo cancellano TUTTE le LMS Question nel
  tearDownClass: eseguirli solo con commit disattivato e rollback finale.
- Le regole del Valutatore sulle consegne dei quiz sono nella scheda valutatore-role; il blocco del
