id = "account-deletion"
title = "Eliminazione dell'account (GDPR)"
status = "active"
summary = """
Ogni utente può cancellare da solo il proprio account dal profilo (o, su telefono, dalla pagina
«Tu»), confermando con la password o con un codice ricevuto via email. La cancellazione è
completa: i dati della persona spariscono, i contenuti che appartengono al cliente (corsi, lezioni,
lezioni dal vivo, compiti corretti) restano senza il suo nome. Se il cliente lo chiede, si può
attivare la revisione: chi non è Gestore invia una richiesta, che un Gestore approva o rifiuta."""
why = """
Requisito della certificazione ESG (punto 3 del piano del 2026-10-23, GDPR art. 17): l'utente deve
poter cancellare i propri dati. L'eliminazione standard di Frappe (Personal Data Deletion Request)
rinomina l'utente in deleted-user-NNNN e conserva tutto sotto quel nome: è una pseudonimizzazione,
che non soddisfa una richiesta di cancellazione. La revisione da parte del Gestore è una regola del
cliente del 2026-10-30, con la decisione di tenerla nelle Impostazioni senza pagina né voce di menu
proprie."""
roles = ["Student", "Gestore", "System Manager", "Moderator"]
behaviour = [
	"ogni utente tranne Administrator vede «Elimina account» sul proprio profilo (non in sola lettura) e, su telefono, una riga «Elimina account» nella pagina «Tu» subito prima di «Esci»",
	"l'eliminazione si conferma con la password; gli account senza password (accesso social) ricevono via email un codice di 6 cifre valido 15 minuti; avvio e conferma sono limitati a 5 tentativi l'ora",
	"una password o un codice sbagliati danno un messaggio di errore senza disconnettere l'utente",
	"confermata l'eliminazione diretta, l'account viene disattivato e tutte le sue sessioni chiuse subito; la cancellazione completa gira in background e al termine l'utente riceve un'email di commiato che ricorda che i badge già emessi su TrueSkills restano su TrueSkills",
	"vengono cancellati per sempre i dati della persona (risposte alle discussioni, recensioni, discussioni aperte da lei senza risposte di altri, file caricati e non allegati, registri di attività e di accesso, notifiche, email in coda, log di emissione TrueSkills, copie nei Deleted Document che la riguardano); nei registri di errore l'indirizzo è sostituito da [deleted user]",
	"corsi, lezioni, lezioni dal vivo e consegne corrette che l'utente ha solo creato o valutato restano: autore e ultimo modificatore diventano Administrator e i riferimenti di ruolo (valutatore, host...) passano ad Administrator o vengono svuotati",
	"con l'opzione «Account Deletion Requires Review» delle LMS Settings attiva, chi non è Gestore, System Manager o Administrator dopo la stessa conferma invia una richiesta invece di cancellare: l'account resta attivo, la richiesta scade a 60 giorni e l'utente la vede e la può ritirare dalla stessa finestra",
	"Gestore e System Manager trovano nelle Impostazioni la scheda «Richieste di eliminazione account» quando la revisione è attiva o restano richieste in attesa; approvare esegue la stessa cancellazione completa, rifiutare richiede un motivo (al massimo 1000 caratteri) che arriva all'utente per email",
