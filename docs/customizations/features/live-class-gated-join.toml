id = "live-class-gated-join"
title = "Accesso controllato alla stanza della lezione live"
status = "active"
summary = """
Il pulsante Partecipa e i link nelle email e nei calendari non portano direttamente alla riunione
Zoom o Meet, ma a un indirizzo della piattaforma che controlla chi sta entrando e quando. Lo studente
entra solo nella finestra prevista e dopo che il docente ha avviato la lezione; prima vede una pagina
che glielo spiega. Chi non ha accesso alla classe non arriva mai alla riunione."""
why = """
Con il link Zoom grezzo nelle email e nella home, gli studenti entravano prima che il docente avesse
avviato la lezione, chiunque ricevesse un'email inoltrata poteva entrare, e l'upstream dava a ogni
studente iscritto anche il link da organizzatore (start_url). Il controllo lato server sostituisce
quello che prima era solo nella card. Separata dalla gestione delle lezioni (decisione del
2026-11-23) perché ha regole proprie da riverificare a ogni merge."""
roles = ["Student", "Moderator", "Batch Evaluator", "Valutatore", "Docente"]
