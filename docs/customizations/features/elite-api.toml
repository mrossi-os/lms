	"apps/os_lms/os_lms/os_lms/doctype/elite_api_key/*",
	"apps/os_lms/os_lms/os_lms/doctype/elite_api_access_log/*",
	"frontend/src/oslms/components/eliteApi/*",
	"apps/os_lms/os_lms/os_lms/tests/test_elite_api_*.py",
	"apps/os_lms/os_lms/os_lms/tests/elite_api_fixture.py",
]
