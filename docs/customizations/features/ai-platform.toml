id = "ai-platform"
title = "Configurazione AI: fornitori, chiavi e prompt"
status = "active"
summary = """
Lo strato comune a tutte le funzioni AI della piattaforma: dalle impostazioni si scelgono il
fornitore (OpenAI, Google Gemini, Anthropic, DeepSeek) e i modelli per il tutor, le simulazioni,
la voce e la trascrizione, si inseriscono le chiavi (salvate cifrate) e si accendono o spengono le
singole funzioni. Un pannello a parte permette di modificare i testi dei prompt dell'AI (Tutor,
Coach, personaggio delle simulazioni, generatore di varianti), che a ogni aggiornamento seguono il
codice solo se nessuno li ha cambiati."""
why = """
Il cliente vuole poter cambiare fornitore e modello senza interventi sul codice, contenere i costi
e adattare il comportamento dell'AI ai propri corsi. La politica AI (certificazione ESG) chiede
inoltre di sapere sempre quale versione del prompt è in uso e di proteggere le chiavi (OWASP A04).
L'upstream non ha alcuna integrazione AI."""
roles = ["System Manager", "Gestore", "Moderator"]
behaviour = [
	"la scheda AI delle impostazioni (Rag Tutor, chiavi API, Simulazioni AI, voce in tempo reale, dettatura e lettura vocale) è visibile solo agli amministratori (System Manager, Administrator); il doctype LMSA Settings ha permessi solo per System Manager",
	"per chat e resoconto si sceglie il fornitore fra OpenAI, Google Gemini, Anthropic, DeepSeek (o «auto», che usa il fornitore predefinito) e il modello; per dettatura e lettura vocale solo OpenAI o Gemini; per la voce in tempo reale OpenAI o Gemini",
	"con il fornitore su «auto», se una chiamata non in streaming fallisce si provano gli altri fornitori nell'ordine di fallback configurato; con un fornitore scelto esplicitamente, o con chiave non valida o contesto troppo lungo, l'errore arriva subito senza tentativi",
	"le chiavi OpenAI, Gemini, DeepSeek, Anthropic e Vimeo sono campi password cifrati; le chiavi OpenAI e Vimeo salvate in chiaro in passato vengono cifrate al migrate e cancellate dallo storico delle modifiche",
	"il pannello «Prompt AI» (amministratori e Gestore) modifica i prompt Tutor AI, Coach AI, Personaggio della simulazione e Generatore di varianti dello scenario: abilitato, system prompt, user template, temperatura, max token, con l'elenco dei segnaposto disponibili; un prompt disabilitato torna al testo del codice",
	"a ogni migrate un prompt ancora uguale a un testo scritto dal codice passa alla versione nuova del codice; un prompt modificato dal pannello resta com'è e il record indica quale versione del codice non è stata applicata",
	"ogni uso di un prompt porta una firma con la versione e l'inizio dell'impronta SHA-256 del testo davvero usato (es. debrief.v2#bb628576), perché l'etichetta di versione resta uguale quando il testo cambia dal pannello",
	"le trascrizioni dei video YouTube e Vimeo usate dall'AI sono conservate in una cache per video e non si richiedono di nuovo",
]
