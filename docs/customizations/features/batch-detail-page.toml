notes = """
- Dal merge di v2.62.0 BatchDetail è costruito su TabbedDetailPage dell'upstream, che identifica le
  schede con chiavi inglesi fisse e segue anche il solo cambio di hash: le nostre voci su chiavi delle
  schede, sincronizzazione dell'hash e intestazione su telefono sono tollerate dal 2026-09-24. Se
  l'upstream torna a confrontare l'etichetta tradotta (tab.label == o currentTabLabel), in italiano
  link diretti e pulsanti dell'intestazione si rompono.
- Il pulsante Importa chiama goToImport della scheda Dashboard: se goToImport sparisce dal
  defineExpose di AdminBatchDashboard il pulsante non fa nulla (vedi batch-students).
- Corsi in bozza: la regola è un'ASSENZA (niente filtro published: 1 sul Link del corso in
  pages/Forms/BatchCourseForm.vue); il rilevatore non si accorge se il filtro torna, va controllato a
  mano dopo ogni merge. Batch Course non ha validazioni lato server sul corso pubblicato.
- BatchOverlay non è montato (commentato in BatchOverview da marzo 2026): il ripiego sull'immagine
  meta_image della voce batch-overlay-meta-image conta solo se l'overlay torna in uso.
- Il bug dei corsi della classe (row.name al posto di row.course) è ancora presente nell'upstream.
- Dashboard e iscrizioni sono nelle schede batch-dashboard e batch-students; il Valutatore nella
  pagina della classe nella scheda valutatore-role; chi aggiunge corsi e valutazioni nella scheda
  batch-management-permissions."""
