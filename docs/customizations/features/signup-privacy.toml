id = "signup-privacy"
title = "Registrazione e consenso privacy"
status = "active"
summary = """
Il modulo pubblico di registrazione non chiede la categoria dell'utente, mostra i termini e
condizioni in un riquadro scorrevole con una casella breve e, se il cliente ha indicato
un'informativa privacy, chiede di accettarla. Chi entra senza un'accettazione registrata (utenti
importati, creati dallo staff o con accesso social) la deve confermare in una finestra al primo
accesso. La registrazione è protetta contro gli abusi: limiti per ora e stessa risposta per chi è
già registrato."""
why = """
Il cliente non usa le categorie utente dell'LMS e il testo lungo dei termini dentro l'etichetta
della casella rendeva il modulo illeggibile (luglio 2026). Il consenso privacy registrato è un
requisito ESG (GDPR art. 7(1), 2026-10-30). I limiti e la risposta uguale per tutti chiudono due
rilievi OWASP del 2026-10-27: l'upstream supera il limite orario con un semplice avviso e dice a
chiunque se un indirizzo è già registrato."""
roles = ["Guest", "Student"]
behaviour = [
	"il modulo di registrazione su /login#signup non mostra la scelta della categoria utente e invia sempre una categoria vuota",
	"il testo dei termini e condizioni delle LMS Settings sta in un riquadro scorrevole alto al massimo 140 px e la casella obbligatoria ha l'etichetta breve «Accetto i Termini e le Condizioni»",
	"con l'URL dell'informativa privacy impostato nelle LMS Settings il modulo ha una casella privacy obbligatoria con il link all'informativa; il server rifiuta la registrazione senza la casella anche se chiamato direttamente",
	"quando il sito userebbe il modulo standard di Frappe (nessun testo dei termini) e l'informativa è impostata, la pagina di accesso serve la copia os_lms del modulo con la casella privacy",
	"alla registrazione l'accettazione viene registrata sull'utente con data, URL dell'informativa e provenienza «Signup»",
	"dopo l'accesso, chiunque non abbia un'accettazione registrata (tranne Administrator) vede nella SPA una finestra che non si chiude, con la casella «Ho letto e accetto l'informativa sulla privacy» (con il link) e i pulsanti Accetta (attivo solo con la casella spuntata) ed Esci; accettando l'accettazione viene registrata con provenienza «Login»",
	"senza URL dell'informativa nelle LMS Settings non compaiono né la casella né la finestra",
	"la registrazione si blocca davvero oltre il limite orario del sito (System Settings, 300 per default) e oltre 10 tentativi l'ora dallo stesso indirizzo IP, con un messaggio che dice fra quanti minuti riprovare",
	"la risposta alla registrazione è sempre «controlla la tua email», che l'indirizzo sia nuovo o già registrato; il titolare di un account attivo riceve invece un'email «Hai già un account» al massimo una volta l'ora",
	"anche il metodo di registrazione di Frappe passa dagli stessi controlli",
]
